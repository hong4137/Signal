<style>
/* ─────────────────────────────────────────────────────────────
   Daily UptoDate — 세 파이프라인을 한 면에 조판한다.
   사진은 쓰지 않는다. 사진 자리에는 우리 숫자로 그린 카드가 들어간다.
   카드는 테마와 무관하게 늘 어둡다 — 신문 위의 보도사진처럼
   지면과 분리된 '그림'으로 읽히게 하려는 것.
   ───────────────────────────────────────────────────────────── */
:root{
  --ground:#E4E8EC; --sheet:#FCFCFB; --ink:#0D1117; --ink-2:#39424D; --muted:#66707C;
  --rule:#0D1117; --hair:#D3D9E0; --heat:#C2491F; --weight:#006E98;
  --shadow:0 1px 0 rgba(13,17,23,.04),0 18px 40px -24px rgba(13,17,23,.28);
  /* 카드(사진 자리) — 고정 다크 */
  --c-bg:#0A0D14; --c-bg2:#111620; --c-ink:#E8E6E1; --c-ink2:#AFB6C0; --c-mut:#7E8996;
  --c-rule:#232B38; --c-heat:#D2603A; --c-weight:#18A2C6;
  /* 큰 한글은 고딕 — 명조 제목은 문학지처럼 읽힌다 (2026-10-05 편집기자 조언).
     명조는 인용문에만 남긴다. 영문 제호는 세리프 그대로(신문 제호의 관례). */
  --head-ko:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",system-ui,sans-serif;
  --serif-ko:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#06080D; --sheet:#0E131C; --ink:#E8E6E1; --ink-2:#AFB6C0; --muted:#7E8996;
    --rule:#E8E6E1; --hair:#222A36; --heat:#D2603A; --weight:#18A2C6;
    --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
    --c-bg:#05070B; --c-bg2:#0A0E15; --c-rule:#1C2330;
  }
}
:root[data-theme="dark"]{
  --ground:#06080D; --sheet:#0E131C; --ink:#E8E6E1; --ink-2:#AFB6C0; --muted:#7E8996;
  --rule:#E8E6E1; --hair:#222A36; --heat:#D2603A; --weight:#18A2C6;
  --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
  --c-bg:#05070B; --c-bg2:#0A0E15; --c-rule:#1C2330;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:#D2603A33}

.sheet{max-width:1240px;margin:28px auto 64px;background:var(--sheet);box-shadow:var(--shadow);
  padding:0 36px 40px}
@media(max-width:700px){.sheet{margin:0;padding:0 16px 32px;box-shadow:none}}

/* ── 상단 띠 ── */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 0 10px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.topbar nav{display:flex;gap:4px;flex-wrap:wrap}
.topbar nav a,.topbar button{font:inherit;color:var(--ink-2);border:1px solid var(--hair);background:none;
  border-radius:999px;padding:3px 11px;cursor:pointer}
.topbar nav a.on{color:var(--sheet);background:var(--ink);border-color:var(--ink)}
.topbar nav a:hover,.topbar button:hover{border-color:var(--ink)}

/* ── 제호 — 61일 담론량 지진계 위에 앉는다 ── */
.mast{position:relative;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:12px 0 9px;text-align:center;overflow:hidden}
.name{position:relative;font-family:var(--serif);font-weight:400;margin:0;
  font-size:clamp(40px,5.4vw,66px);line-height:.95;letter-spacing:-.02em}
.name em{color:var(--heat);font-style:italic}
.name a{color:inherit;text-decoration:none}
.sub{position:relative;margin-top:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
  color:var(--ink-2)}
@media(max-width:700px){.sub{letter-spacing:.06em;font-size:10px}}
.dateline{display:flex;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;
  border-bottom:3px double var(--rule);padding:8px 0 7px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.dateline b{color:var(--ink);font-weight:700}

/* ── 지면 그리드 ── */
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.15fr) minmax(0,1fr);
  margin-top:22px}
.col{padding:0 22px;min-width:0}
.col+.col{border-left:1px solid var(--hair)}
.col:first-child{padding-left:0}.col:last-child{padding-right:0}
@media(max-width:1020px){
  .page{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .c-lead{grid-column:1/-1;order:-1;padding:0 0 26px!important;border:0!important;
    border-bottom:1px solid var(--hair)!important;margin-bottom:22px}
  .c-left{padding-left:0}
}
@media(max-width:700px){
  .page{grid-template-columns:minmax(0,1fr)}
  .col{padding:0!important;border:0!important}
  .c-left{border-bottom:1px solid var(--hair)!important;padding-bottom:22px!important;margin-bottom:22px}
}

.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--heat);
  font-weight:700;text-transform:uppercase;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.kicker.w{color:var(--weight)}
.kicker .ln{flex:1;height:1px;background:var(--hair)}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;font-weight:700;color:var(--ink);
  border-top:2px solid var(--rule);padding-top:7px;margin:0 0 14px;display:flex;justify-content:space-between}
.sect span{color:var(--muted);font-weight:400;letter-spacing:.06em}

/* 톱 */
.lead h2,.story h3,.domlead h3,.pcq,.subh{text-wrap:balance}
.lead h2{font-family:var(--head-ko);font-weight:800;margin:0 0 12px;
  font-size:clamp(32px,4.4vw,52px);line-height:1.16;letter-spacing:-.03em;word-break:keep-all}
.lead .deck{font-family:var(--head-ko);font-weight:400;font-size:18px;line-height:1.6;color:var(--ink-2);
  margin:0 0 16px;word-break:keep-all}
.byline{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:16px;display:flex;
  flex-wrap:wrap;gap:4px 14px}
.byline a{color:var(--weight)}
.lead .body{font-size:15.5px;line-height:1.75;color:var(--ink);word-break:keep-all;margin:16px 0 0}
/* 드롭캡은 소설·잡지의 장치라 뺐다 (편집기자 조언). 대신 기사식 꼬리표로 무엇의 요약인지 밝힌다 */
.lead .body::before{content:"댓글창 요약";display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:.14em;color:var(--heat);margin-bottom:4px}
.why{margin-top:14px;font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.7}
.why i{font-style:normal;border:1px solid var(--hair);border-radius:3px;padding:0 5px;margin-right:3px;color:var(--ink-2)}

/* ── 카드 — 사진 자리 ── */
.card{background:var(--c-bg);color:var(--c-ink);border-radius:2px;position:relative;overflow:hidden;
  font-family:var(--sans)}
.card .cap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--c-mut);
  display:flex;justify-content:space-between;gap:8px}
.card .cap b{color:var(--c-heat);font-weight:700}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(#18A2C60C 1px,transparent 1px),linear-gradient(90deg,#18A2C60C 1px,transparent 1px);
  background-size:24px 24px}
.card>*{position:relative}
figcaption{font-size:12.5px;color:var(--muted);margin:7px 0 0;line-height:1.55;word-break:keep-all}
figcaption b{color:var(--ink-2);font-weight:600}
figure{margin:0}

/* 논쟁 카드 */
.dc{padding:22px 24px 20px}
.dc .big{display:flex;gap:28px;align-items:flex-end;margin:16px 0 8px;flex-wrap:wrap}
.dc .big div{line-height:1}
.dc .big .n{font-family:var(--mono);font-weight:700;font-size:clamp(46px,6vw,72px);letter-spacing:-.04em}
.dc .big .l{font-size:12px;color:var(--c-ink2);margin-top:6px;letter-spacing:.04em}
.dc .big .r{margin-left:auto;text-align:right}
.bars{display:grid;gap:5px;margin:4px 0 18px}
.bars div{height:6px;border-radius:1px}
.gauge{margin:6px 0 20px}
.gl{position:relative;height:16px;font-family:var(--mono);font-size:10.5px;color:var(--c-mut)}
.gl span{position:absolute;transform:translateX(-50%);white-space:nowrap;top:0}
.gt{position:relative;height:12px;margin:3px 0 4px;border-bottom:1px solid #3A4352}
.gt i{position:absolute;bottom:0;height:8px;background:#D2603A}
.gt b{position:absolute;bottom:-1px;width:1px;height:6px;background:#3A4352}
.gt b.base{width:2px;height:14px;background:#E8E6E1}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0 14px;align-items:stretch;
  border-top:1px solid var(--c-rule);padding-top:16px}
.vs .side{font-size:13.5px;line-height:1.6;color:var(--c-ink);word-break:keep-all}
.vs .side .t{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;margin-bottom:6px;
  display:inline-block;padding:1px 7px;border-radius:2px}
.vs .a .t{background:#18A2C622;color:var(--c-weight)}
.vs .b .t{background:#D2603A26;color:var(--c-heat)}
.vs .b{text-align:right}
.vs .mid{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--c-mut);align-self:center}
@media(max-width:520px){.vs{grid-template-columns:1fr}.vs .mid{text-align:center;margin:6px 0}.vs .b{text-align:left}
  .dc{padding:18px 16px}.dc .big{gap:18px}.dc .big .r{margin-left:0;text-align:left}}

.subh{font-family:var(--head-ko);font-weight:700;font-size:19px;line-height:1.45;margin:-4px 0 12px;
  color:var(--heat);word-break:keep-all}
.sub2{font-size:13px;font-weight:600;color:var(--ink-2);margin:-2px 0 6px;line-height:1.45;word-break:keep-all}
/* 외신면 — 섹션을 신문 단처럼 흘린다 */
.fx .fxcols{column-count:3;column-gap:30px;column-rule:1px solid var(--hair)}
@media(max-width:1020px){.fx .fxcols{column-count:2}}
@media(max-width:640px){.fx .fxcols{column-count:1}}
.fxsec{break-inside:avoid-column;margin-bottom:20px}
.fxname{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;font-weight:700;color:var(--heat);
  border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:10px}
.fxi{display:block;padding:0 0 11px;margin:0 0 11px;border-bottom:1px dotted var(--hair);break-inside:avoid}
.fxsec .fxi:last-child{border:0;margin-bottom:0}
.fxph{display:block;position:relative;overflow:hidden;border-radius:2px;background:var(--hair)}
.fxph img{display:block;width:100%;height:100%;object-fit:cover}
.fxph i{position:absolute;right:5px;bottom:4px;font-style:normal;font-family:var(--mono);font-size:9px;
  letter-spacing:.06em;color:#E8E6E1;background:#05070BB3;padding:0 5px;border-radius:2px}
.has-lead .fxph{aspect-ratio:16/9;margin-bottom:9px}
.has-lead .t{font-size:17.5px!important}
/* 한겨레식 — 글 오른쪽 정사각 썸네일 */
.has-side{display:grid!important;grid-template-columns:minmax(0,1fr) 84px;column-gap:12px;align-items:start}
.has-side .fxph{grid-column:2;grid-row:1/span 4;aspect-ratio:1;width:84px}
.has-side .fxph i{display:none}
.has-side>span:not(.fxph){grid-column:1}
.fxi .t{display:block;font-family:var(--head-ko);font-weight:700;font-size:15.5px;line-height:1.42;word-break:keep-all}
.fxi .u{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:2px;word-break:keep-all}
.fxi .d{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:4px;word-break:keep-all}
/* 사진 카드 */
.pc{margin:2px 0 18px}
.pcimg{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:var(--c-bg)}
.pcimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pcshade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(5,7,11,.55) 0%,rgba(5,7,11,0) 28%,rgba(5,7,11,0) 42%,rgba(5,7,11,.92) 100%)}
.pctag{position:absolute;left:18px;top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:#E8E6E1;font-weight:700}
.pcnum{position:absolute;right:16px;top:12px;text-align:right;color:#E8E6E1;font-size:10.5px;
  font-family:var(--mono);letter-spacing:.06em;line-height:1.1}
.pcnum b{display:block;font-size:30px;color:#D2603A;letter-spacing:-.03em}
.pcq{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;font-family:var(--head-ko);font-weight:800;
  font-size:clamp(19px,2.5vw,28px);line-height:1.3;letter-spacing:-.02em;word-break:keep-all;
  text-shadow:0 1px 12px rgba(0,0,0,.5)}
.pcq::before{content:"“";color:#D2603A;margin-right:2px}
.pcq::after{content:"”";color:#D2603A;margin-left:2px}
.pc figcaption a{color:var(--weight)}
@media(max-width:520px){.pcnum b{font-size:22px}.pctag{left:12px;top:10px}.pcq{left:12px;right:12px;bottom:10px}}
.thumb{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;margin-bottom:10px;
  background:var(--hair)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.12em;background:#05070BCC;color:#E8E6E1;padding:2px 7px;border-radius:2px}
/* 외신 레일 */
.story{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid var(--hair)}
.story:last-child{border-bottom:0}
.story h3{font-family:var(--head-ko);font-weight:700;font-size:19px;line-height:1.38;margin:0 0 7px;
  letter-spacing:-.02em;word-break:keep-all}
.story p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.62;word-break:keep-all}
.echo{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:10.5px;
  color:var(--heat);border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.noecho{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.wire{list-style:none;margin:0;padding:0}
.wire li{padding:0 0 13px;margin:0 0 13px;border-bottom:1px dotted var(--hair)}
.wire li:last-child{border:0}
.wire .en{font-weight:600;font-size:14px;line-height:1.4;display:block;margin-bottom:4px}
.wire .ko{font-size:12.5px;color:var(--ink-2);line-height:1.55;display:block;word-break:keep-all}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px;display:block}
.meta .h{color:var(--heat)} .meta .w{color:var(--weight)}

/* 해석 레일 */
.tc{padding:16px 16px 14px}
.tc .head{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 10px}
.tc .g{font-size:15px;font-weight:600}
.tc .x{font-family:var(--mono);font-weight:700;font-size:40px;line-height:.9;color:var(--c-heat);letter-spacing:-.04em}
.tc svg{width:100%;height:96px;display:block}
.voice{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--hair)}
.voice:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
  color:#fff;background:var(--weight)}
.av.A{background:var(--heat)}
.voice .who{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.voice .who span{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--muted)}
.voice q{display:block;font-family:var(--serif-ko);font-size:14px;line-height:1.66;color:var(--ink);margin-top:4px;
  quotes:"“" "”";word-break:keep-all}
.voice .tr{font-size:13px;line-height:1.5;margin-top:4px}

/* 국내면 */
.dom{margin-top:30px;border-top:3px solid var(--rule);padding-top:10px}
.domhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.domhead h2{font-family:var(--head-ko);font-weight:800;font-size:24px;margin:0;letter-spacing:-.02em}
.domhead h2 small{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.14em;color:var(--muted);margin-left:10px}
.domgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 0}
.domgrid>*{min-width:0}
.domlead{padding-right:26px}
.domlead h3{font-family:var(--head-ko);font-weight:800;font-size:clamp(23px,2.6vw,30px);line-height:1.3;
  letter-spacing:-.025em;margin:0 0 14px;word-break:keep-all}
.sc{padding:16px 16px 14px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px;margin:14px 0 6px}
.dots div{height:30px;border-radius:2px;background:#18A2C61F;border:1px solid #18A2C640;

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const DOW = '일월화수목금토';

/* 'Guardian Featured, TechCrunch, The Verge 다매체 보도' → 'Guardian 외 2곳' */
function shortSrc(src){
  const t = String(src || '').replace(/다매체 보도|Featured|Hero/g, '').trim();
  const p = t.split(/\s*,\s*/).filter(Boolean);
  return p.length > 1 ? `${p[0]} 외 ${p.length - 1}곳` : (p[0] || '');
}

function korDate(ymd){
  const d = new Date(ymd + 'T00:00:00+09:00');
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
}

/* ── 사진 카드 — 외신 브리핑이 고른 사진 위에 카드뉴스처럼 글을 얹는다 ── */
function photoCard(L, R){
  const I = L.img;
  return `<figure class="pc">
  <a class="pcimg" href="${esc(L.fact_url || '#')}">
    <img src="${esc(I.src)}" srcset="${esc(I.sm)} 640w, ${esc(I.src)} 1200w" sizes="(max-width:700px) 100vw, 640px"
      alt="${esc(I.alt)}" width="1200" height="675">
    <span class="pcshade"></span>
    <span class="pctag">외신 브리핑 TOP${L.fact_src && L.fact_src.includes('·') ? ' · ' + esc(shortSrc(L.fact_src.split('·').slice(1).join('·'))) : ''}</span>
    ${R ? `<span class="pcnum"><b>${fmt(R.comments)}</b>커뮤니티 댓글</span>` : ''}
    ${L.sub ? `<span class="pcq">${esc(L.sub.replace(/^["“]|["”]$/g, ''))}</span>` : ''}
  </a>
  <figcaption>${I.credit ? `<b>사진</b> <a href="${esc(I.credit_url)}">${esc(I.credit)}</a> / Unsplash` : '<b>사진</b> Unsplash'} · 외신 브리핑 선정</figcaption>
</figure>`;
}

/* ── 카드: 논쟁 ── */
function debateCard(R){
  const tot = Math.max(R.comments, R.points, 1);
  const rmax = 3, rv = Math.min(R.r, rmax);
  const pc = v => +(v/rmax*100).toFixed(1);
  const S = R.sides;
  return `<figure>
  <div class="card dc">
    <div class="cap"><span><b>논쟁</b> · Hacker News 댓글창</span><span>${R.r >= 1 ? '논쟁선 위' : '논쟁선 아래'}</span></div>
    <div class="big">
      <div><div class="n" style="color:var(--c-heat)">${fmt(R.comments)}</div><div class="l">댓글</div></div>
      <div><div class="n" style="color:var(--c-weight)">${fmt(R.points)}</div><div class="l">추천</div></div>
      <div class="r"><div class="n" style="color:var(--c-ink)">${R.r.toFixed(2)}</div><div class="l">추천 1개당 댓글</div></div>
    </div>
    <div class="bars" aria-hidden="true">
      <div style="width:${(R.comments/tot*100).toFixed(1)}%;background:var(--c-heat)"></div>
      <div style="width:${(R.points/tot*100).toFixed(1)}%;background:var(--c-weight)"></div>
    </div>
    <div class="gauge" aria-hidden="true">
      <div class="gl"><span style="left:${pc(rv)}%;color:var(--c-heat);font-weight:700">${R.r.toFixed(2)} ▾</span></div>
      <div class="gt">
        <i style="left:${pc(1)}%;width:${Math.max(0, pc(rv)-pc(1)).toFixed(1)}%"></i>
        ${[0,0.5,1,1.5,2,2.5,3].map(t => `<b class="${t===1?'base':''}" style="left:${pc(t)}%"></b>`).join('')}
      </div>
      <div class="gl"><span style="left:0;transform:none">0</span><span style="left:${pc(1)}%;color:var(--c-ink)">1.0 논쟁선</span><span style="left:auto;right:0;transform:none">3.0</span></div>
    </div>
    ${S ? `<div class="vs">
      <div class="side a"><span class="t">${esc(S.la)}</span><div>${esc(S.a)}</div></div>
      <div class="mid">vs</div>
      <div class="side b"><span class="t">${esc(S.lb)}</span><div>${esc(S.b)}</div></div>
    </div>` : ''}
  </div>
  <figcaption><b>그림</b> 「${esc(R.title)}」 토론의 댓글·추천 비율. 추천보다 댓글이 많으면 동의보다 반박이 오간 글이다.</figcaption>
</figure>`;
}

/* ── 카드: 온도 ── */
function tempCard(T){
  if (!T) return '';
  const v = T.values, n = v.length, max = Math.max(...v, 1);
  const W = 300, H = 96, bw = W/n;
  const prior = v.slice(-7,-3), avg = prior.reduce((a,b)=>a+b,0) / (prior.length||1);
  let g = '';
  v.forEach((x,i) => {
    const h = (x/max) * (H-14), recent = i >= n-3, base = i >= n-7 && i < n-3;
    g += `<rect x="${(i*bw+1.5).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${h.toFixed(1)}"
      fill="${recent ? '#D2603A' : base ? '#18A2C6' : '#2A3341'}"/>`;
  });
  const ay = H - (avg/max)*(H-14);
  return `<figure>
  <div class="card tc">
    <div class="cap"><span><b>온도</b> · 주제군 담론량</span><span>${esc(T.dates[0])}–${esc(T.dates.at(-1))}</span></div>
    <div class="head"><div class="g">${esc(T.group)}</div><div class="x">×${T.ratio}</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${g}
      <line x1="${((n-7)*bw).toFixed(1)}" x2="${W}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="#E8E6E1" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <figcaption><b>그림</b> 최근 3일(주황)이 그 전 4일(청록) 평균(점선)의 ${T.ratio}배. 하루 단위, 오늘 미완성분 제외.</figcaption>
</figure>`;
}

/* ── 카드: 확산 ── */
function spreadCard(L){
  const n = L.outlets || 0, src = L.sources || [];
  let cells = '';
  for (let i = 0; i < n; i++) cells += src[i] ? `<div class="on" title="${esc(src[i])}">${esc(src[i])}</div>` : `<div></div>`;
  return `<figure>
  <div class="card sc">
    <div class="cap"><span><b style="color:var(--c-weight)">확산</b> · 같은 날 같은 사안</span><span>Must News 집계</span></div>
    <div class="big"><span class="n">${n}</span><span class="l">개 매체가 썼다</span></div>
    <div class="dots">${cells}</div>
  </div>
  <figcaption><b>그림</b> 한 칸이 매체 하나. 이름이 확인된 ${src.length}곳만 표시했다.</figcaption>
</figure>`;
}

/* ── 카드: 피처 줄다리기 ── */
function tugCard(f){
  const S = f.sides;
  return `<div class="card fc">
    <div class="rv">${f.r.toFixed(2)}<small>추천당 댓글</small></div>
    ${S ? `<div class="tug"><span class="a">${esc(S.la)}</span><span class="b">${esc(S.lb)}</span></div>` : '<div></div>'}
    <div class="sm">댓글 ${fmt(f.comments)} · 추천 ${fmt(f.points)}</div>
  </div>`;
}

function render(F){
  const L = F.lead, R = L && L.reaction;
  const ymd = (F.edition || '').slice(0,10);
  const S = F.sources || {};
  $('#dateline').innerHTML = `
    <span><b>${esc(korDate(ymd))}</b></span>
    <span>제 ${F.no ?? '–'}호</span>
    <span>외신 ${esc(S.briefing || '–')} · 국내 ${esc((S.must||'–').slice(5))} · 커뮤니티 ${esc((S.signal||'–').slice(5))}</span>`;

  /* 톱 */
  let lead = '';
  if (L){
    const cross = L.kind === 'cross';
    lead = `<article class="lead">
      <div class="kicker">${cross ? '교차 · 외신 보도 × 커뮤니티 반향' : '반향 · 커뮤니티 최대 토론'}<span class="ln"></span></div>
      <h2>${L.fact_url ? `<a class="hl" href="${esc(L.fact_url)}">${esc(L.headline)}</a>` : esc(L.headline)}</h2>
      ${L.img ? photoCard(L, R) : (L.sub ? `<p class="subh">${esc(L.sub)}</p>` : '')}
      <p class="deck">${esc(L.deck)}</p>
      <div class="byline"><span>사실 — <a href="${esc(L.fact_url || '#')}">외신 브리핑 카드</a>${L.fact_src && L.fact_src.includes('·') ? ' · ' + esc(shortSrc(L.fact_src.split('·').slice(1).join('·'))) : ''}</span>
        ${L.orig_url ? `<span><a href="${esc(L.orig_url)}">원문 ↗</a></span>` : ''}
        <span>반향 — <a href="${esc(R.url)}">HN 토론 ${fmt(R.comments)}개 댓글</a></span></div>
      ${debateCard(R)}
      ${R.summary ? `<p class="body">${esc(R.summary)}</p>` : ''}
      ${(R.kr||[]).length ? `<div class="why" style="margin-top:12px">국내 연결 — ${R.kr.map(k=>`<a href="${esc(k.url)}" style="color:var(--weight)">${esc(k.title)}</a>`).join(' · ')}</div>` : ''}
      ${cross && L.why ? `<div class="why">톱 선정 근거 — 외신 꼭지와 커뮤니티 글이 같은 사건을 가리킨다:
        ${L.why.entities.map(e=>`<i>${esc(e)}</i>`).join('')}${L.why.shared.map(e=>`<i>${esc(e)}</i>`).join('')}</div>` : ''}
    </article>`;
  }

  /* 좌: 외신 + 해외 반향 */
  const left = `
    <div class="sect">외신 <span>${esc(S.briefing||'')}</span></div>
    ${(F.left||[]).map((s, i) => `<article class="story">
      ${s.img ? `<a class="thumb" href="${esc(s.url||'#')}"><img src="${esc(s.img.sm)}" alt="${esc(s.img.alt)}" loading="lazy" width="640" height="360"><span>TOP ${i + 1 + (L && L.kind === 'cross' ? 1 : 0)}</span></a>` : ''}
      <h3><a class="hl" href="${esc(s.url||'#')}">${esc(s.head || s.title)}</a></h3>
      ${s.sub ? `<div class="sub2">${esc(s.sub)}</div>` : ''}
      <p>${esc(s.deck)}</p>
      ${s.source ? `<span class="meta">${esc(shortSrc(s.source))}</span>` : ''}
      ${s.echo ? `<a class="echo" href="${esc(s.echo.url)}">커뮤니티 반향 · 댓글 ${fmt(s.echo.comments)} · r ${s.echo.r.toFixed(2)}</a>`
               : `<span class="noecho">커뮤니티 반향 없음</span>`}
    </article>`).join('')}
    ${(F.wire||[]).length ? `<div class="sect" style="margin-top:8px">외신 밖의 반향 <span>HN·Reddit</span></div>
    <ul class="wire">${F.wire.map(w => `<li><a href="${esc(w.url)}">
      <span class="en hl">${esc(w.title)}</span><span class="ko">${esc(w.deck)}</span>
      <span class="meta"><span class="h">댓글 ${fmt(w.comments)}</span> · r ${w.r.toFixed(2)}</span></a></li>`).join('')}</ul>` : ''}`;

  /* 우: 해석 */
  const voices = (F.voices||[]).map(v => v.kind === 'panel'
    ? `<div class="voice"><div class="av ${esc(v.tier)}">${esc((v.who||'?').trim()[0])}</div><div>
        <div class="who">${esc(v.who)} <span>@${esc(v.handle)} · ${esc((v.ts||'').slice(5,16))}</span></div>
        <a href="https://www.threads.com/@${esc(v.handle)}"><q>${esc(v.text)}</q></a></div></div>`
    : `<div class="voice"><div class="av">✓</div><div>
        <div class="who">${esc(v.who)} <span>신뢰층이 링크</span></div>
        <a class="tr hl" href="${esc(v.url)}">${esc(v.text)}</a>
        <span class="meta">댓글 ${fmt(v.comments)} · r ${Number(v.r).toFixed(2)}</span></div></div>`).join('');
  const right = `
    <div class="sect">온도 <span>14일</span></div>
    ${tempCard(F.temperature)}
    <div class="sect" style="margin-top:22px">국내 해석 <span>Threads 패널</span></div>
    ${voices || '<p class="meta">수집된 글 없음</p>'}`;

  /* 국내면 */
  const D = F.domestic || {};
  const FS = F.foreign || [];
  const nF = FS.reduce((n, x) => n + x.items.length, 0);
  const foreign = nF ? `<section class="dom fx">
    <div class="domhead"><h2>외신<small>JFNB 외신 브리핑 · ${esc(S.briefing || '')} · ${nF + (F.left||[]).length + (L && L.kind === 'cross' ? 1 : 0)}건</small></h2>
      <a class="meta" href="${esc((F.links||{}).briefing||'#')}" style="color:var(--weight)">브리핑 전체 →</a></div>
    <div class="fxcols">${FS.map(sec => `<div class="fxsec">
      <div class="fxname">${esc(sec.name)}</div>
      ${sec.items.map(x => `<a class="fxi${x.img ? ' has-' + x.img.size : ''}" href="${esc(x.url)}">
        ${x.img ? `<span class="fxph"><img src="${esc(x.img.src)}" alt="${esc(x.img.alt)}" loading="lazy"
          width="${x.img.size === 'lead' ? 960 : 240}" height="${x.img.size === 'lead' ? 540 : 240}"><i>자료사진</i></span>` : ''}
        <span class="t hl">${esc(x.head)}</span>
        ${x.sub ? `<span class="u">${esc(x.sub)}</span>` : ''}
        <span class="d">${esc(x.deck)}</span>
        <span class="meta">${esc(shortSrc(x.source))}${x.echo ? ` · <span class="h">커뮤니티 댓글 ${fmt(x.echo.comments)}</span>` : ''}</span>
      </a>`).join('')}
    </div>`).join('')}</div></section>` : '';

  const dom = D.lead ? `<section class="dom">
    <div class="domhead"><h2>국내<small>MUST NEWS · ${esc((D.updated||'').slice(5))}</small></h2>
      <a class="meta" href="${esc((F.links||{}).must||'#')}" style="color:var(--weight)">전체 순위 →</a></div>
    <div class="domgrid">
      <div class="domlead">
        <div class="kicker w">가장 넓게 퍼진 사안<span class="ln"></span></div>
        <h3><a class="hl" href="${esc(D.lead.url)}">${esc(D.lead.title)}</a></h3>
        ${spreadCard(D.lead)}
      </div>
      <ol class="domlist">${(D.list||[]).map(a => `<li><span class="rk">${esc(a.rank)}</span>
        <a href="${esc(a.url)}"><span class="t hl">${esc(a.title)}</span><span class="s">${esc(a.source)}</span></a>
        <span class="ol">${fmt(a.outlets)}곳</span></li>`).join('')}</ol>
    </div></section>` : '';

  /* 피처 */
  const feat = (F.features||[]).length ? `<section class="feat infeat">
    <div class="sect">논쟁 <span>댓글창이 갈라진 글</span></div>
    <div class="featgrid">${F.features.map(f => `<article>
      ${tugCard(f)}
      <h3><a class="hl" href="${esc(f.url)}">${esc(f.title)}</a></h3>
      <p>${esc(f.deck)}</p></article>`).join('')}</div></section>` : '';

  $('#main').innerHTML = `<div class="page">
      <div class="col c-left">${left}</div>
      <div class="col c-lead">${lead}${feat}</div>
      <div class="col c-right">${right}</div>
    </div>${foreign}${dom}`;

  $('#foot').innerHTML = `<span>조판 ${esc(F.edition)} KST · 사진은 외신 브리핑이 고른 것(Unsplash), '자료사진'은 그 보관함에서 주제로 골랐다 · 나머지 그림은 수집 데이터</span>
    <span><a href="${esc((F.links||{}).briefing||'#')}">외신 브리핑</a> · <a href="${esc((F.links||{}).must||'#')}">Must News</a> · <a href="index.html">반향 관측</a></span>`;
}

(async () => {
  try {
    const F = await fetch('data/front.json', {cache:'no-cache'})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
    render(F);
  } catch (e) {
    $('#main').innerHTML = `<div class="err">지면을 불러오지 못했습니다 (${esc(e.message)}).</div>`;
  }
})();

/* 맨 위로 */
(() => {
  const b = $('#totop');
  const upd = () => b.classList.toggle('on', scrollY > innerHeight);
  addEventListener('scroll', upd, {passive:true}); upd();
  b.addEventListener('click', () => scrollTo({top:0, behavior:
    matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}));
})();

/* 테마 — index.html 과 같은 키를 쓴다 */
(() => {
  const KEY = 'signal-theme', root = document.documentElement;
  $('#tgl').addEventListener('click', () => {
    const cur = root.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nx);
    try { localStorage.setItem(KEY, nx); } catch(e) {}
  });
})();
</script>
