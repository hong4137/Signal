<style>
/* ─────────────────────────────────────────────────────────────
   Daily UptoDate — AI·테크 신문 1면.
   지면 문법은 한국 일간지에서 가져왔다 (조선·동아·중앙·한겨레 실측, 2026-10-07).
   · 1면 블록: 사이드 기사 | 톱 | 오피니언 — 그 아래 주요기사 줄 — 그 아래 섹션면(외신·국내·커뮤니티)
   · 제목은 한 문장, 줄은 칸 폭이 정한다. 크기로 위계를 준다 (톱 > 사이드 > 줄 > 목록).
   · 모바일은 톱 사진을 화면 끝까지, 나머지는 '제목+요약 | 오른쪽 사진' 목록.
   · 작은 고정폭 꼬리표 대신 읽히는 고딕 꼬리표. 숫자만 고정폭.
   ───────────────────────────────────────────────────────────── */
:root{
  --ground:#EDEEF2; --sheet:#FFFFFF; --ink:#111216; --ink-2:#4A4D57; --muted:#7A7E8A;
  --rule:#111216; --hair:#E6E7EC; --soft:#F4F4F7;
  --heat:#E2264F; --weight:#3D63F0; --violet:#8B5CF6;
  --blue:#4E74FA; --pur:#AC7DFF; --pink:#F94E6F; --bar:#141519;
  --grad:linear-gradient(90deg,#4E74FA 0%,#AC7DFF 55%,#F94E6F 100%);
  --shadow:0 1px 0 rgba(13,17,23,.04),0 18px 40px -24px rgba(13,17,23,.28);
  /* 데이터 그림 — 테마와 무관하게 어둡다 (사진 자리) */
  --c-bg:#0A0D14; --c-ink:#E8E6E1; --c-ink2:#AFB6C0; --c-mut:#7E8996; --c-rule:#232B38;
  --c-heat:#F94E6F; --c-weight:#4E74FA;
  --ko:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif-ko:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --serif:"Sora",var(--ko);
  --latin:"Sora","Pretendard Variable",Pretendard,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#04060E; --sheet:#090E21; --ink:#F3F4F8; --ink-2:#B7BBCB; --muted:#8C91A6;
    --rule:#F3F4F8; --hair:#1E2440; --soft:#11162C;
    --heat:#FF5C7C; --weight:#7C95FF; --violet:#B794FF; --bar:#000000;
    --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
    --c-bg:#05070B; --c-rule:#1C2330;
  }
}
:root[data-theme="dark"]{
  --ground:#04060E; --sheet:#090E21; --ink:#F3F4F8; --ink-2:#B7BBCB; --muted:#8C91A6;
  --rule:#F3F4F8; --hair:#1E2440; --soft:#11162C;
  --heat:#FF5C7C; --weight:#7C95FF; --violet:#B794FF; --bar:#000000;
  --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
  --c-bg:#05070B; --c-rule:#1C2330;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ko);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
img{display:block;max-width:100%}
.ph{display:block}
figure{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:#AC7DFF44}
h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}

.sheet{max-width:1240px;margin:24px auto 64px;background:var(--sheet);box-shadow:var(--shadow);padding:0 36px 36px}

/* ── 상단 띠 · 제호 · 날짜줄 ── */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 36px;margin:0 -36px;
  font-size:12.5px;color:#C9CBD3;background:var(--bar)}
.topbar nav{display:flex;gap:4px}
.topbar nav a,.topbar button{font:inherit;font-size:12.5px;color:#E7E8EE;border:1px solid #3A3D47;background:none;
  border-radius:999px;padding:3px 12px;cursor:pointer}
.topbar nav a.on{color:#fff;background:var(--grad);border-color:transparent}
.mast{border-bottom:1px solid var(--rule);padding:22px 0 14px;text-align:center}
.name{margin:0;line-height:1}
.name a{display:inline-flex;align-items:center;gap:clamp(12px,1.6vw,20px)}
.name .seal{width:clamp(58px,7vw,92px);height:auto;flex:none;color:var(--ink)}
#seal{display:flex}
.name .wm{display:flex;flex-direction:column;align-items:flex-start;font-family:var(--latin);font-weight:800;
  font-size:clamp(44px,6.2vw,80px);letter-spacing:-.045em;line-height:.95;color:var(--ink)}
.name .wm small{font:700 clamp(10px,1vw,13px)/1 var(--latin);letter-spacing:.42em;color:var(--muted);margin:0 0 .28em .12em}
.name .wm b{font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:7px;font-size:12.5px;letter-spacing:.12em;color:var(--ink-2)}
.dateline{display:flex;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;border-bottom:3px double var(--rule);
  padding:8px 0 7px;font-size:12.5px;color:var(--ink-2)}
.dateline b{color:var(--ink);font-weight:700}

.secnav{display:flex;justify-content:center;gap:28px;padding:9px 0 8px;border-bottom:1px solid var(--hair);
  font-size:14px;font-weight:700}
.secnav a{color:var(--ink-2)}
.secnav a:hover{color:var(--ink);box-shadow:inset 0 -3px 0 0 var(--pur)}
.secn{scroll-margin-top:12px}

/* ── 꼬리표 ── */
.lab{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:5px}
.lab.f{color:var(--heat)} .lab.d{color:var(--weight)} .lab.c{color:var(--violet)}
.src{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.src .h{color:var(--heat);font-weight:600}
.secthd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:2px solid var(--rule);
  padding-top:9px;margin:0 0 16px}
.secthd h2{font-size:21px;letter-spacing:-.02em}
.secthd h2 small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.secthd a,.secthd span{font-size:12.5px;color:var(--weight)}
.mini{display:flex;justify-content:space-between;font-size:13px;font-weight:800;border-top:2px solid var(--rule);
  padding-top:8px;margin:0 0 12px}
.mini span{font-weight:500;color:var(--muted);font-size:12px}

/* ── 1면 블록 ── */
.front{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,290px);margin-top:22px}
.front>*{min-width:0}
.fside{padding-right:24px;border-right:1px solid var(--hair)}
.flead{padding:0 26px}
.fop{padding-left:24px;border-left:1px solid var(--hair)}

/* 사이드 기사 */
.story{display:block;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
.story:last-child{border:0;margin-bottom:0}
.story .ph{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;margin-bottom:10px;background:var(--soft)}
.story .ph img{width:100%;height:100%;object-fit:cover}
.story h3{font-size:19px;line-height:1.38}
/* 사이드 둘째부터는 작은 썸네일 — 첫 기사만 큰 사진 (칸 높이를 톱·일정 칸과 맞춘다) */
@media(min-width:1021px){
  .fside .story+.story{display:grid;grid-template-columns:minmax(0,1fr) 84px;column-gap:12px;align-items:start}
  .fside .story+.story>*{grid-column:1}
  .fside .story+.story .ph{grid-column:2;grid-row:1/span 5;aspect-ratio:1;margin:2px 0 0}
  .fside .story+.story h3{font-size:17px}
  .fside .story+.story p{-webkit-line-clamp:2}
}
.story .sb{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.45}
.story p{margin:7px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph .file{position:absolute;right:5px;bottom:4px;font-size:10px;color:#E8E6E1;background:#05070BB3;padding:0 5px;border-radius:2px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.echo{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--heat);border:1px solid currentColor;
  border-radius:999px;padding:1px 10px}

/* 톱 */
.lead .kick{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--grad);border-radius:999px;
  padding:4px 11px;margin-bottom:10px;letter-spacing:.01em}
.lead h2{font-size:clamp(28px,3vw,40px);line-height:1.24;margin-bottom:14px}
.lead .subh{font-size:18px;font-weight:700;color:var(--ink-2);margin:-4px 0 14px;line-height:1.45;display:none}
.lead .deck{font-size:16.5px;line-height:1.72;color:var(--ink);margin:14px 0 12px}
.lead .by{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.lead .by a{color:var(--weight)}
.pc .pcimg{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:var(--c-bg)}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,0) 45%,rgba(5,7,11,.88) 100%)}
.pc .q{position:absolute;left:18px;right:18px;bottom:15px;color:#fff;font-weight:800;font-size:clamp(18px,2vw,24px);
  line-height:1.35;letter-spacing:-.02em;text-shadow:0 1px 12px rgba(0,0,0,.5);text-wrap:balance}
.pc figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.pc figcaption a{color:var(--weight)}

/* 쟁점 박스 — 신문의 찬반 박스. 커뮤니티 반응을 두 진영으로 */
.issue{margin-top:18px;border:1px solid var(--hair);border-top:3px solid var(--heat);background:var(--soft);padding:14px 16px 14px}
.issue .ih{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.issue .ih b{font-size:14.5px;font-weight:800}
.issue .ih span{font-size:12.5px;color:var(--muted)}
.issue .ih .num{color:var(--heat);font-weight:700}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sides>div{padding:0 14px 0 0;font-size:14px;line-height:1.62;color:var(--ink)}
.sides>div+div{padding:0 0 0 14px;border-left:1px solid var(--hair)}
.sides .t{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:2px;margin-bottom:6px}
.sides .a .t{background:color-mix(in srgb,var(--weight) 15%,transparent);color:var(--weight)}
.sides .b .t{background:color-mix(in srgb,var(--heat) 15%,transparent);color:var(--heat)}
.issue p{margin:0;font-size:14px;line-height:1.65}
.issue .go{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--weight);font-weight:600}
.relh{margin-top:18px;font-size:13px;font-weight:800;border-top:1px solid var(--rule);padding-top:8px}
.rel{list-style:none;margin:6px 0 0;padding:0;font-size:15px;font-weight:600}
.rel li{padding:5px 0 5px 12px;position:relative;line-height:1.5}
.rel li::before{content:"";position:absolute;left:0;top:13px;width:4px;height:4px;background:var(--ink-2)}
.rel li span{font-size:12px;color:var(--muted);margin-left:6px}

/* 오피니언 — 국내 필진(Threads)·해외 필진이 소개한 글 */
.op{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair)}
.op:last-of-type{border-bottom:0}
.op .who{font-size:12.5px;font-weight:800;color:var(--violet)}
.op .who span{font-weight:500;color:var(--muted);margin-left:5px}
.op q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;quotes:"“" "”";
  font-family:var(--serif-ko);font-size:15px;line-height:1.6;margin-top:4px;font-weight:500}
.op .tr{display:block;font-size:15px;font-weight:700;line-height:1.45;margin-top:4px}
.op .when{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}
/* 패널 글 — 누르면 그 자리에서 전문이 펼쳐진다 (Threads 로 넘어가지 않는다) */
.opx{cursor:pointer}
.opx:hover q{color:var(--ink)}
#opdlg{border:0;padding:0;width:min(560px,calc(100% - 32px));max-height:min(78vh,720px);background:var(--sheet);color:var(--ink);
  border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.45);display:none;flex-direction:column}
#opdlg[open]{display:flex}
#opdlg::backdrop{background:rgba(6,8,13,.55)}
#opdlg .dh{display:grid;grid-template-columns:44px minmax(0,1fr) 32px;gap:12px;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--hair)}
#opdlg .dh b{display:block;font-size:15px;color:var(--violet)}
#opdlg .dh span{font-size:12.5px;color:var(--muted)}
#opdlg .dx{background:none;border:0;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:0}
#opdlg .db{padding:16px 20px;overflow:auto;white-space:pre-line;font-family:var(--serif-ko);font-size:16px;line-height:1.75}
#opdlg .df{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px 16px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--muted)}
#opdlg .df a{color:var(--weight);font-weight:700}
#opdlg .dn{margin-left:auto;display:flex;align-items:center;gap:8px}
#opdlg .dn button{width:32px;height:32px;border-radius:50%;border:1px solid var(--hair);background:none;color:var(--ink);cursor:pointer;font-size:14px}
#opdlg .dn button:disabled{opacity:.3;cursor:default}
#opdlg .dn i{font-style:normal;font-family:var(--mono)}
@media(max-width:700px){
  #opdlg{width:100%;max-width:none;margin:auto 0 0;border-radius:14px 14px 0 0;max-height:85vh}   /* 아래에서 올라오는 시트 */
}
.op .more{font-weight:600;color:var(--violet);margin-left:8px}
.opx:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;
  background:var(--weight)}
.av.A{background:var(--heat)} .av.T{background:var(--violet)}
/* 숫자로 본 오늘 */
.numbox{margin-top:18px;border-top:2px solid var(--rule);padding-top:9px}
.flead .numbox{margin-top:22px}
/* 주요 경제 일정 */
.calbox{border:2px solid transparent;border-radius:14px;padding:12px 14px 6px;
  background:linear-gradient(var(--sheet),var(--sheet)) padding-box,var(--grad) border-box}
.calbox .mini{margin-top:0;border-top:0;padding-top:0}
.calnone{margin:10px 0 0}
.cpager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.cpager i{font-style:normal;font-family:var(--mono)}
.cpager button{width:28px;height:28px;border-radius:50%;border:1px solid var(--hair);background:none;color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.cpager button:disabled{opacity:.3;cursor:default}
/* 부톱 — 사이드에서 내려온 기사, 톱 아래 가로 배치 */
.flead .story.sub{display:grid;grid-template-columns:minmax(0,1fr) 200px;column-gap:18px;align-items:start;
  margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--rule);border-bottom:0}
.flead .story.sub>*{grid-column:1}
.flead .story.sub .ph{grid-column:2;grid-row:1/span 6;margin:2px 0 0}
.flead .story.sub h3{font-size:20px}
.cday{margin-top:6px}
.cday>b{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:800;
  padding:4px 0 3px;border-bottom:1px solid var(--hair)}
.cday>b span{font-weight:600;font-size:11.5px;color:var(--heat)}
.cday ul{list-style:none;margin:0;padding:0}
.ce{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 8px;padding:8px 0;border-bottom:1px dotted var(--hair)}
.cday li:last-child{border-bottom:0}
.ce .ct{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--muted);padding-top:2px}
.ce .cn{display:block;font-size:14px;font-weight:600;line-height:1.42;color:var(--ink);text-decoration:none;text-wrap:balance}
.ce a.cn:hover{text-decoration:underline}
.ce.i5 .cn{font-weight:800}
.ce.i5 .ct{color:var(--heat);font-weight:700}
.ce .rg{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);
  border:1px solid var(--hair);border-radius:2px;padding:0 3px;margin:0;line-height:1.45;font-family:var(--ko)}
.ce .uv{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}
.ce p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const DOW = '일월화수목금토';
/* 제목 — 한 문장, 줄은 칸 폭이 정한다. '·' 나열이 줄 끝에서 끊기지 않게 단어 결합자로 묶는다 */
const hd = s => esc(String(s ?? '').replace(/\s*\n\s*/g, ' ')).replace(/·/g, '⁠·⁠');
const spaced = s => String(s || '').replace(/([.!?])(?=[가-힣A-Z])/g, '$1 ');   // 언론사 요약의 붙은 문장 띄우기

function korDate(ymd){
  const d = new Date(ymd + 'T00:00:00+09:00');
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
}
function shortSrc(src){
  const t = String(src || '').replace(/다매체 보도|Featured|Hero/g, '').trim();
  const p = t.split(/\s*,\s*/).filter(Boolean);
  return p.length > 1 ? `${p[0]} 외 ${p.length - 1}곳` : (p[0] || '');
}
const KIND = { foreign: 'f', domestic: 'd', community: 'c' };
/* 수집기의 주제 묶음 이름 → 독자용 이름 */
const TOPIC = { '안전·거버넌스': 'AI 안전·규제', '모델릴리스': '새 AI 모델 출시', '에이전트': 'AI 에이전트',
  '인프라·칩': '인프라·반도체', '보안·사고': '보안 사고', '개발도구': '개발 도구' };
/* 사진 귀퉁이 꼬리표 — 기업 뉴스룸 사진은 '<회사> 제공', 검수 자료사진은 '자료사진' */
const badge = img => img.nr ? `<i class="file" title="${esc(img.credit || img.nr)}">${esc(img.nr)}</i>` : img.file ? '<i class="file">자료사진</i>' : '';
const ph = (img, cls = 'ph') => img ? `<span class="${cls}"><img src="${esc(img.sm || img.src)}" alt="${esc(img.alt)}" loading="lazy">${badge(img)}</span>` : '';

/* 국내 기사 첫머리 — sharktalk.co.kr 포털이 언론사 공개 요약(og:description)을 받아 준다 */
/* 원문 첫머리에 남은 HTML 엔티티(&middot; 등)를 글자로 — textarea 에 넣었다 빼면 브라우저가 풀어 준다 */
const unent = s => { if (!s || !/&[#\w]+;/.test(s)) return s || ''; const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const mustLede = (id, idx) => /^\d{8}_\d{4}$/.test(id || '') && Number.isInteger(idx)
  ? fetch(`https://sharktalk.co.kr/api/board/must/${id}/${idx}/lead`).then(r => r.ok ? r.json() : {}).then(j => spaced(unent(j && j.lead))).catch(() => '')
  : Promise.resolve('');

/* ── 조각들 ── */
function storyCard(x){          // 1면 사이드
  return `<a class="story" href="${esc(x.url)}">
    ${ph(x.img)}
    <span class="lab ${KIND[x.kind]}">${esc(x.label)}</span>
    <h3 class="hl">${hd(x.head)}</h3>
    ${x.sub ? `<span class="sb">${hd(x.sub)}</span>` : ''}
    <p ${x.kind === 'domestic' ? `data-mi="${x.must_idx}"` : ''}>${esc(x.deck)}</p>
    <span class="src">${esc(x.src || '')}${x.echo ? ` · <span class="h">커뮤니티 댓글 ${fmt(x.echo.comments)}</span>` : ''}</span>
  </a>`;
}
function rowCard(x){            // 주요기사 줄
  return `<a href="${esc(x.url)}">
    ${ph(x.img)}
    <span class="lab ${KIND[x.kind]}">${esc(x.label)}</span>
    <h3 class="hl">${hd(x.head)}</h3>

function numBox(T){             // 숫자로 본 오늘 — 주제군 온도
  if (!T) return '';
  const v = T.values, n = v.length, max = Math.max(...v, 1), W = 280, H = 54, bw = W / n;
  const bars = v.map((x, i) => {
    const h = Math.max(1, x / max * (H - 4)), recent = i >= n - 3;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${recent ? 'var(--heat)' : 'var(--hair)'}"/>`;
  }).join('');
  return `<div class="numbox">
    <div class="nh">숫자로 본 오늘<span>최근 14일</span></div>
    <div class="nv"><b>‘${esc(TOPIC[T.group] || T.group)}’ 이야기</b><span class="x">×${T.ratio}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>
    <p>해외 개발자 커뮤니티(Hacker News·Reddit)에서 이 주제 글에 달린 댓글이 최근 3일 동안 그 전 4일보다 ${T.ratio}배 많았다. 막대 하나가 하루, 오늘은 아직 집계 중이라 뺐다.</p>
  </div>`;
}

const REG = { KR: '한국', US: '미국', CN: '중국', JP: '일본', EU: '유럽', GLOBAL: '세계' };
function calBox(C){              // 주요 경제 일정 — 오늘부터 3일, 확정된 것만, 한국 시간
  /* '오늘'은 판 날짜가 아니라 읽는 시점(한국 시간) — 지난 일정은 뺀다 */
  const ymd = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const end = new Date(Date.parse(ymd + 'T00:00:00Z') + 2 * 864e5).toISOString().slice(0, 10);
  const evs = ((C && C.events) || []).filter(e => e.date >= ymd && e.date <= end && e.verified !== false);
  const day = d => { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth()+1}.${x.getDate()} (${DOW[x.getDay()]})`; };
  const rel = d => d === ymd ? '오늘' : d === new Date(Date.parse(ymd + 'T00:00:00Z') + 864e5).toISOString().slice(0, 10) ? '내일' : '';
  const groups = {};
  evs.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  const html = Object.keys(groups).sort().map(d => `<div class="cday"><b>${day(d)}<span>${rel(d)}</span></b><ul>${
    groups[d].map(e => {
      const cv = [e.consensus && '예상 ' + e.consensus, e.previous && '직전 ' + e.previous].filter(Boolean).join(' · ');
      const nm = esc(e.title);          // 지역 꼬리표는 왼쪽 시각 아래 — 제목이 두 줄이 돼도 왼쪽 끝이 가지런하다
      return `<li class="ce${e.importance >= 5 ? ' i5' : ''}"><span class="ct">${esc(e.time || '–')}<em class="rg">${esc(REG[e.region] || e.region || '')}</em></span><div>
        ${e.source ? `<a class="cn" href="${esc(e.source)}" target="_blank" rel="noopener">${nm}</a>` : `<span class="cn">${nm}</span>`}
        ${e.why ? `<p>${esc(e.why)}</p>` : ''}${cv ? `<p class="cv">${esc(cv)}</p>` : ''}</div></li>`;
    }).join('')}</ul></div>`).join('');
  return `<div class="calbox" id="calbox"><div class="mini">주요 경제 일정<span>오늘부터 3일 · 한국 시간</span></div>
    ${html || '<p class="src calnone">사흘 안에 확정된 주요 일정이 없다</p>'}</div>`;
}

function balanceFront(){
  const fs = document.querySelector('.fside'), fl = document.querySelector('.flead'), fo = document.querySelector('.fop');
  if (!fs || !fl || !fo) return;
  const inner = (el, skip) => [...el.children].filter(c => c !== skip).reduce((a, c) => {
    const st = getComputedStyle(c); return a + c.getBoundingClientRect().height + parseFloat(st.marginTop) + parseFloat(st.marginBottom);
  }, 0);
  const nb = document.querySelector('.numbox');

  // ① 부톱
  const stories = fs.querySelectorAll('.story');
  if (stories.length >= 3 && inner(fs) - inner(fl, nb) > 260) {
    const last = stories[stories.length - 1];
    last.classList.add('sub');
    fl.appendChild(last);
  }
  // ②
  if (nb && inner(fl, nb) < inner(fo, nb)) fl.appendChild(nb);

  // ③ 일정 쪽 넘김
  const box = document.getElementById('calbox');
  const target = Math.max(inner(fs), inner(fl));
  if (!box || inner(fo) <= target + 8) return;
  const days = [...box.querySelectorAll('.cday')];
  if (!days.length) return;
  const PAGER = 40;
  const fixed = inner(fo) - inner(box) + (box.firstElementChild ? box.firstElementChild.getBoundingClientRect().height : 0);
  const avail = target - fixed - PAGER - 12;
  const hd = days[0].querySelector('b').getBoundingClientRect().height + 6;
  const pages = [[]];
  let h = 0;
  days.forEach(d => {
    let cur = null;
    [...d.querySelectorAll('.ce')].forEach(li => {
      const lh = li.getBoundingClientRect().height;
      if (h > 0 && h + lh + (cur ? 0 : hd) > avail) { pages.push([]); h = 0; cur = null; }
      if (!cur) {
        cur = document.createElement('div'); cur.className = 'cday';
        cur.appendChild(d.querySelector('b').cloneNode(true));
        cur.appendChild(document.createElement('ul'));
        pages[pages.length - 1].push(cur); h += hd;
      }
      cur.querySelector('ul').appendChild(li); h += lh;
    });
  });
  if (pages.length < 2) return;
  days.forEach(d => d.remove());
  const wrap = document.createElement('div');
  pages.forEach((pg, k) => {
    const el = document.createElement('div'); el.className = 'cpg'; el.hidden = k > 0;
    pg.forEach(d => el.appendChild(d)); wrap.appendChild(el);
  });
  const nav = document.createElement('div'); nav.className = 'cpager';
  nav.innerHTML = `<button type="button" data-d="-1" aria-label="앞 일정">‹</button><i>1 / ${pages.length}</i><button type="button" data-d="1" aria-label="다음 일정">›</button>`;
  box.appendChild(wrap); box.appendChild(nav);
  let at = 0;
  const go = d => {
    at = Math.max(0, Math.min(pages.length - 1, at + d));
    wrap.querySelectorAll('.cpg').forEach((el, k) => { el.hidden = k !== at; });
    nav.querySelector('i').textContent = `${at + 1} / ${pages.length}`;
    nav.querySelector('[data-d="-1"]').disabled = at === 0;
    nav.querySelector('[data-d="1"]').disabled = at === pages.length - 1;
  };
  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.d); });
  go(0);
}

/* 날짜 소인 — 로고. 가운데는 그날 판 날짜, 07:40(발행 시각) 눈금만 핑크 */
function sealSVG(ymd){
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const [y, m, d] = (ymd || new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10)).split('-');
  const ticks = Array.from({length: 60}, (_, i) => {
    const a = i / 60 * 2 * Math.PI - Math.PI / 2, big = i % 5 === 0, hot = i === 46;
    const r2 = hot ? 29.4 : big ? 32.6 : 33.8, f = n => (50 + n).toFixed(2);
    return `<line x1="${f(35.2 * Math.cos(a))}" y1="${f(35.2 * Math.sin(a))}" x2="${f(r2 * Math.cos(a))}" y2="${f(r2 * Math.sin(a))}" stroke="${hot ? '#F94E6F' : 'url(#sg)'}" stroke-width="${hot ? 2.6 : big ? 1.1 : .55}" stroke-linecap="round"/>`;
  }).join('');
  return `<svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E74FA"/><stop offset=".55" stop-color="#AC7DFF"/><stop offset="1" stop-color="#F94E6F"/></linearGradient>
      <path id="sring" d="M50 50m-41 0a41 41 0 1 1 82 0a41 41 0 1 1-82 0"/></defs>
    <circle cx="50" cy="50" r="47.5" fill="none" stroke="url(#sg)" stroke-width="2.4"/>
    <circle cx="50" cy="50" r="35.6" fill="none" stroke="url(#sg)" stroke-width="1.1"/>
    <text font-family="Sora,sans-serif" font-weight="700" font-size="7" fill="currentColor"><textPath href="#sring" textLength="255" lengthAdjust="spacing">DAILY UPTODATE ✦ AI &amp; TECH MORNING EDITION ✦ SEOUL ✦&#160;</textPath></text>
    ${ticks}
    <text x="50" y="41.5" text-anchor="middle" font-family="Sora,sans-serif" font-weight="700" font-size="6.4" letter-spacing="1.4" fill="currentColor">${MON[+m - 1]} · ${y}</text>
    <text x="50" y="67" text-anchor="middle" font-family="Sora,sans-serif" font-weight="800" font-size="27" letter-spacing="-1.5" fill="currentColor">${d}</text>
  </svg>`;
}

function render(F){
  const L = F.lead, R = L && L.reaction, S = F.sources || {}, SL = F.slots || { side: [], row: [] };

  let dlg = document.getElementById('opdlg');
  if (!dlg && PV.length) {
    dlg = document.createElement('dialog');
    dlg.id = 'opdlg';
    dlg.setAttribute('aria-label', '필진 글 전문');
    document.body.appendChild(dlg);
    dlg.addEventListener('click', e => {
      if (e.target === dlg) dlg.close();                       // 바깥(배경) 클릭
      const b = e.target.closest('[data-go]');
      if (b) showOp(+b.dataset.go);
      if (e.target.closest('.dx')) dlg.close();
    });
    let tx = null;                                             // 휴대폰: 옆으로 밀어 넘기기
    dlg.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    dlg.addEventListener('touchend', e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx, n = +dlg.dataset.i; tx = null;
      if (dx < -60 && n < PV.length - 1) showOp(n + 1);
      if (dx > 60 && n > 0) showOp(n - 1);
    });
    dlg.addEventListener('keydown', e => {
      const n = +dlg.dataset.i;
      if (e.key === 'ArrowRight' && n < PV.length - 1) showOp(n + 1);
      if (e.key === 'ArrowLeft' && n > 0) showOp(n - 1);
    });
  }
  function showOp(n){
    const v = PV[n]; if (!v) return;
    dlg.dataset.i = n;
    dlg.innerHTML = `<div class="dh"><div class="av ${esc(v.tier)}">${esc((v.who || '?').trim()[0])}</div>
        <div><b>${esc(v.who)}</b><span>${esc(v.role || '@' + v.handle)}</span></div>
        <button class="dx" type="button" aria-label="닫기">×</button></div>
      <div class="db">${esc(v.full || v.text)}</div>
      <div class="df"><span>국내 필진 · Threads · ${esc((v.ts || '').slice(5, 16))}</span>
        <a href="https://www.threads.com/@${esc(v.handle)}" target="_blank" rel="noopener">Threads에서 보기 ↗</a>
        <span class="dn"><button type="button" data-go="${n - 1}" ${n ? '' : 'disabled'} aria-label="이전 글">←</button>
          <i>${n + 1} / ${PV.length}</i>
          <button type="button" data-go="${n + 1}" ${n < PV.length - 1 ? '' : 'disabled'} aria-label="다음 글">→</button></span></div>`;
    if (!dlg.open) dlg.showModal();
    dlg.querySelector('.db').scrollTop = 0;
  }
  document.querySelectorAll('.opx').forEach((el, n) => {
    const open = () => showOp(n);
    el.addEventListener('click', e => { if (!e.target.closest('a')) open(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });

  /* 1면 칸 맞추기 (데스크톱) — 세 칸 높이를 고르게
     ① 가운데(톱)가 왼쪽보다 한참 짧으면 사이드 마지막 기사를 톱 아래 '부톱'으로 내린다
     ② '숫자로 본 오늘'은 톱 칸과 일정 칸 중 짧은 쪽 아래에 붙인다
     ③ 그래도 일정 칸이 왼쪽·가운데보다 길면 일정을 쪽으로 나눠 넘겨 본다 (첫 쪽 = 오늘·내일) */
  if (innerWidth > 1020) balanceFront();

  /* 국내 첫머리 — 톱·순위·1면 칸 */  /* 국내 첫머리 — 톱·순위·1면 칸 */
  const mid = SL.must_id || (D.lead && D.lead.must_id);
  if (D.lead && !D.lead.lede) mustLede(mid, D.lead.must_idx).then(t => { const el = $('#domlede'); if (t && el) { el.textContent = t; el.hidden = false; } });
  document.querySelectorAll('[data-mi]').forEach(el => {
    if (el.dataset.mi === '' || el.textContent.trim()) return;
    mustLede(mid, +el.dataset.mi).then(t => { if (t) { el.textContent = t; el.hidden = false; } });
  });

  $('#foot').innerHTML = `<span>조판 ${esc(F.edition)} KST · 사진은 외신 브리핑이 고른 것과 그 보관함의 자료사진(Unsplash) · 그래프는 자체 집계</span>
    <span><a href="${esc((F.links || {}).briefing || '#')}">외신 브리핑</a> · <a href="${esc((F.links || {}).must || '#')}">Must News</a> · <a href="index.html">커뮤니티 동향</a></span>`;
}

(async () => {
  try {
    const F = await fetch('data/front.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    render(F);
  } catch (e) {
    $('#main').innerHTML = `<div class="err">지면을 불러오지 못했습니다 (${esc(e.message)}).</div>`;
  }
})();

/* 방문자 수 — 외신 브리핑과 같은 방식(abacus, 같은 사람은 KST 하루 한 번) */
(() => {
  const API = 'https://abacus.jasoncameron.dev', NS = 'hong4137-uptodate', LS = 'uptodate-visited';
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let seen = false;
  try { seen = localStorage.getItem(LS) === today; } catch (e) {}
  const mode = seen ? 'get' : 'hit', val = d => (d && (d.value ?? d.count));
  Promise.all([
    fetch(`${API}/${mode}/${NS}/global`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`${API}/${mode}/${NS}/daily-${today}`).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([t, d]) => {
    if (typeof val(t) !== 'number') return;
    if (!seen) { try { localStorage.setItem(LS, today); } catch (e) {} }
    $('#v-tot').textContent = fmt(val(t));
    $('#v-day').textContent = fmt(typeof val(d) === 'number' ? val(d) : 0);
    $('#visits').hidden = false;
  });
})();

/* 맨 위로 */
(() => {
  const b = $('#totop');
  const upd = () => b.classList.toggle('on', scrollY > innerHeight);
  addEventListener('scroll', upd, { passive: true }); upd();
  b.addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
})();

/* 테마 — index.html 과 같은 키 */
$('#tgl').addEventListener('click', () => {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', nx);
  try { localStorage.setItem('signal-theme', nx); } catch (e) {}
});
</script>
