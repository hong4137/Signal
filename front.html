<style>
/* ─────────────────────────────────────────────────────────────
   Daily UptoDate — AI·테크 신문 1면.
   지면 문법은 한국 일간지에서 가져왔다 (조선·동아·중앙·한겨레 실측, 2026-10-07).
   · 1면 블록: 사이드 기사 | 톱 | 오피니언 — 그 아래 주요기사 줄 — 그 아래 섹션면(외신·국내·커뮤니티)
   · 제목은 한 문장, 줄은 칸 폭이 정한다. 크기로 위계를 준다 (톱 > 사이드 > 줄 > 목록).
   · 모바일은 톱 사진을 화면 끝까지, 나머지는 '제목+요약 | 오른쪽 사진' 목록.
   · 작은 고정폭 꼬리표 대신 읽히는 고딕 꼬리표. 숫자만 고정폭.
   ───────────────────────────────────────────────────────────── */
:root{
  --ground:#E6E9ED; --sheet:#FFFFFF; --ink:#111418; --ink-2:#3A424C; --muted:#6B7480;
  --rule:#111418; --hair:#DDE2E7; --soft:#F4F6F8;
  --heat:#C2491F; --weight:#006E98; --violet:#6A4FD0;
  --shadow:0 1px 0 rgba(13,17,23,.04),0 18px 40px -24px rgba(13,17,23,.28);
  /* 데이터 그림 — 테마와 무관하게 어둡다 (사진 자리) */
  --c-bg:#0A0D14; --c-ink:#E8E6E1; --c-ink2:#AFB6C0; --c-mut:#7E8996; --c-rule:#232B38;
  --c-heat:#D2603A; --c-weight:#18A2C6;
  --ko:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif-ko:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#06080D; --sheet:#0E131C; --ink:#ECEAE5; --ink-2:#B4BBC5; --muted:#808B98;
    --rule:#ECEAE5; --hair:#232B37; --soft:#141A24;
    --heat:#D2603A; --weight:#18A2C6; --violet:#9C88F7;
    --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
    --c-bg:#05070B; --c-rule:#1C2330;
  }
}
:root[data-theme="dark"]{
  --ground:#06080D; --sheet:#0E131C; --ink:#ECEAE5; --ink-2:#B4BBC5; --muted:#808B98;
  --rule:#ECEAE5; --hair:#232B37; --soft:#141A24;
  --heat:#D2603A; --weight:#18A2C6; --violet:#9C88F7;
  --shadow:0 0 0 1px #161C26,0 24px 60px -30px rgba(0,0,0,.8);
  --c-bg:#05070B; --c-rule:#1C2330;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ko);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
img{display:block;max-width:100%}
.ph{display:block}
figure{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:#D2603A33}
h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.025em;text-wrap:balance}

.sheet{max-width:1240px;margin:24px auto 64px;background:var(--sheet);box-shadow:var(--shadow);padding:0 36px 36px}

/* ── 상단 띠 · 제호 · 날짜줄 ── */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 10px;
  font-size:12.5px;color:var(--muted)}
.topbar nav{display:flex;gap:4px}
.topbar nav a,.topbar button{font:inherit;font-size:12.5px;color:var(--ink-2);border:1px solid var(--hair);background:none;
  border-radius:999px;padding:3px 12px;cursor:pointer}
.topbar nav a.on{color:var(--sheet);background:var(--ink);border-color:var(--ink)}
.mast{border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0 9px;text-align:center}
.name{font-family:var(--serif);font-weight:400;margin:0;font-size:clamp(40px,5.4vw,66px);line-height:.95;letter-spacing:-.02em}
.name em{color:var(--heat);font-style:italic}
.tag{margin-top:7px;font-size:12.5px;letter-spacing:.12em;color:var(--ink-2)}
.dateline{display:flex;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;border-bottom:3px double var(--rule);
  padding:8px 0 7px;font-size:12.5px;color:var(--ink-2)}
.dateline b{color:var(--ink);font-weight:700}

/* ── 꼬리표 ── */
.lab{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:5px}
.lab.f{color:var(--heat)} .lab.d{color:var(--weight)} .lab.c{color:var(--violet)}
.src{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.src .h{color:var(--heat);font-weight:600}
.secthd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:2px solid var(--rule);
  padding-top:9px;margin:0 0 16px}
.secthd h2{font-size:21px;letter-spacing:-.02em}
.secthd h2 small{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.secthd a,.secthd span{font-size:12.5px;color:var(--weight)}
.mini{display:flex;justify-content:space-between;font-size:13px;font-weight:800;border-top:2px solid var(--rule);
  padding-top:8px;margin:0 0 12px}
.mini span{font-weight:500;color:var(--muted);font-size:12px}

/* ── 1면 블록 ── */
.front{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) minmax(0,290px);margin-top:22px}
.front>*{min-width:0}
.fside{padding-right:24px;border-right:1px solid var(--hair)}
.flead{padding:0 26px}
.fop{padding-left:24px;border-left:1px solid var(--hair)}

/* 사이드 기사 */
.story{display:block;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
.story:last-child{border:0;margin-bottom:0}
.story .ph{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;margin-bottom:10px;background:var(--soft)}
.story .ph img{width:100%;height:100%;object-fit:cover}
.story h3{font-size:19px;line-height:1.38}
.story .sb{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.45}
.story p{margin:7px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph .file{position:absolute;right:5px;bottom:4px;font-size:10px;color:#E8E6E1;background:#05070BB3;padding:0 5px;border-radius:2px}
.echo{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--heat);border:1px solid currentColor;
  border-radius:999px;padding:1px 10px}

/* 톱 */
.lead .kick{font-size:13px;font-weight:800;color:var(--heat);margin-bottom:8px}
.lead h2{font-size:clamp(28px,3vw,40px);line-height:1.24;margin-bottom:14px}
.lead .subh{font-size:18px;font-weight:700;color:var(--ink-2);margin:-4px 0 14px;line-height:1.45;display:none}
.lead .deck{font-size:16.5px;line-height:1.72;color:var(--ink);margin:14px 0 12px}
.lead .by{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.lead .by a{color:var(--weight)}
.pc .pcimg{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:var(--c-bg)}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,0) 45%,rgba(5,7,11,.88) 100%)}
.pc .q{position:absolute;left:18px;right:18px;bottom:15px;color:#fff;font-weight:800;font-size:clamp(18px,2vw,24px);
  line-height:1.35;letter-spacing:-.02em;text-shadow:0 1px 12px rgba(0,0,0,.5);text-wrap:balance}
.pc figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.pc figcaption a{color:var(--weight)}

/* 쟁점 박스 — 신문의 찬반 박스. 커뮤니티 반응을 두 진영으로 */
.issue{margin-top:18px;border:1px solid var(--hair);border-top:3px solid var(--heat);background:var(--soft);padding:14px 16px 14px}
.issue .ih{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.issue .ih b{font-size:14.5px;font-weight:800}
.issue .ih span{font-size:12.5px;color:var(--muted)}
.issue .ih .num{color:var(--heat);font-weight:700}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sides>div{padding:0 14px 0 0;font-size:14px;line-height:1.62;color:var(--ink)}
.sides>div+div{padding:0 0 0 14px;border-left:1px solid var(--hair)}
.sides .t{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:2px;margin-bottom:6px}
.sides .a .t{background:color-mix(in srgb,var(--weight) 15%,transparent);color:var(--weight)}
.sides .b .t{background:color-mix(in srgb,var(--heat) 15%,transparent);color:var(--heat)}
.issue p{margin:0;font-size:14px;line-height:1.65}
.issue .go{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--weight);font-weight:600}
.relh{margin-top:18px;font-size:13px;font-weight:800;border-top:1px solid var(--rule);padding-top:8px}
.rel{list-style:none;margin:6px 0 0;padding:0;font-size:15px;font-weight:600}
.rel li{padding:5px 0 5px 12px;position:relative;line-height:1.5}
.rel li::before{content:"";position:absolute;left:0;top:13px;width:4px;height:4px;background:var(--ink-2)}
.rel li span{font-size:12px;color:var(--muted);margin-left:6px}

/* 오피니언 — Threads 패널·신뢰층 */
.op{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair)}
.op:last-of-type{border-bottom:0}
.op .who{font-size:12.5px;font-weight:800;color:var(--violet)}
.op .who span{font-weight:500;color:var(--muted);margin-left:5px}
.op q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;quotes:"“" "”";
  font-family:var(--serif-ko);font-size:15px;line-height:1.6;margin-top:4px;font-weight:500}
.op .tr{display:block;font-size:15px;font-weight:700;line-height:1.45;margin-top:4px}
.op .when{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;
  background:var(--weight)}
.av.A{background:var(--heat)} .av.T{background:var(--violet)}
/* 숫자로 본 오늘 */
.numbox{margin-top:18px;border-top:2px solid var(--rule);padding-top:9px}
.numbox .nh{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.numbox .nh span{font-weight:500;color:var(--muted);font-size:12px}
.numbox .nv{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 6px}
.numbox .nv b{font-size:16px}
.numbox .nv .x{font-family:var(--mono);font-weight:700;font-size:34px;color:var(--heat);letter-spacing:-.04em}
.numbox svg{width:100%;height:54px;display:block}
.numbox p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ── 주요기사 줄 ── */
.row{margin-top:28px}
.rowg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.rowg>a{display:block;padding:0 18px;min-width:0}
.rowg>a:first-child{padding-left:0}
.rowg>a:last-child{padding-right:0}
.rowg>a+a{border-left:1px solid var(--hair)}
.rowg .ph{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;margin-bottom:10px;background:var(--soft)}
.rowg .ph img{width:100%;height:100%;object-fit:cover}
.rowg h3{font-size:17px;line-height:1.4}
.rowg .sb{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.rowg p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.58;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rowg p:empty{display:none}

/* ── 섹션면 ── */
.secn{margin-top:34px}
/* 외신면 */
.fxcols{column-count:3;column-gap:30px;column-rule:1px solid var(--hair)}
.fxsec{break-inside:avoid-column;margin-bottom:22px}
.fxname{font-size:13px;font-weight:800;color:var(--heat);border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:10px}
.fxi{display:block;padding:0 0 12px;margin:0 0 12px;border-bottom:1px solid var(--hair);break-inside:avoid}
.fxsec .fxi:last-child{border:0;margin-bottom:0}
.fxi .ph{position:relative;overflow:hidden;border-radius:2px;background:var(--soft)}
.fxi .ph img{width:100%;height:100%;object-fit:cover}
.has-lead .ph{aspect-ratio:16/9;margin-bottom:9px}
.has-side{display:grid!important;grid-template-columns:minmax(0,1fr) 84px;column-gap:12px;align-items:start}
.has-side .ph{grid-column:2;grid-row:1/span 4;aspect-ratio:1;width:84px}
.has-side .ph .file{display:none}
.has-side>span:not(.ph){grid-column:1}
.fxi .t{display:block;font-weight:800;font-size:16px;line-height:1.42;letter-spacing:-.02em}
.has-lead .t{font-size:18px}
.fxi .u{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-top:2px}
.fxi .d{display:block;font-size:13px;color:var(--muted);line-height:1.58;margin-top:4px}
/* 국내면 */
.domgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.domgrid>*{min-width:0}
.domlead{padding-right:26px}
.domtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;margin-bottom:12px}
.domtop h3{font-size:clamp(22px,2.4vw,28px);line-height:1.32}
.reach{text-align:right;line-height:1}
.reach b{display:block;font-family:var(--mono);font-weight:700;font-size:clamp(36px,4vw,50px);color:var(--weight);letter-spacing:-.04em}
.reach span{display:block;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}
.domlede{margin:0 0 14px;font-size:15px;line-height:1.72;color:var(--ink-2)}
.angles{border-top:2px solid var(--weight);padding-top:8px}
.anghd{font-size:13px;font-weight:800;color:var(--weight);margin-bottom:2px}
.ang{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}
.ang:last-child{border:0}
.ang .s{font-size:12.5px;font-weight:700;color:var(--weight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ang .t{font-weight:600;font-size:15px;line-height:1.45}
.domlist{list-style:none;margin:0;padding:0 0 0 26px;border-left:1px solid var(--hair)}
.domlist li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--hair)}
.domlist li:first-child{padding-top:0}
.domlist li:last-child{border:0}
.domlist .rk{font-family:var(--serif);font-size:24px;line-height:1;color:var(--muted)}
.domlist .t{font-weight:700;font-size:16px;line-height:1.45}
.domlist .s{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.domlist .l2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:5px}
.domlist .l2[hidden]{display:none}
.ol{font-family:var(--mono);font-size:12px;color:var(--weight);white-space:nowrap}
.domlist .bar{position:absolute;left:38px;bottom:-1px;height:2px;background:var(--weight);opacity:.85;max-width:calc(100% - 38px)}
.picknote{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
/* 커뮤니티면 */
.comg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.comg>*{min-width:0;padding:0 20px}
.comg>*:first-child{padding-left:0}
.comg>*:last-child{padding-right:0}
.comg>*+*{border-left:1px solid var(--hair)}
.cm h3{font-size:17px;line-height:1.4}
.cm .sb{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.cm p{margin:7px 0 0;font-size:14px;color:var(--ink-2);line-height:1.62}
.tug{display:flex;height:24px;border-radius:2px;overflow:hidden;font-size:12px;font-weight:800;margin:4px 0 10px}
.tug span{display:flex;align-items:center;padding:0 9px;white-space:nowrap;color:#fff}
.tug .a{background:var(--weight)} .tug .b{background:var(--heat);flex:1;justify-content:flex-end}
.rnum{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rnum b{color:var(--heat);font-size:20px;letter-spacing:-.03em;margin-right:4px}

footer{margin-top:34px;border-top:1px solid var(--rule);padding-top:12px;font-size:12px;color:var(--muted);line-height:1.8;
  display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
footer a{color:var(--weight)}
.visits{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
.visits b{color:var(--ink-2);font-weight:600;font-family:var(--mono)}
.visits span{margin:0 8px}
.visits[hidden]{display:none}
.err{padding:60px 0;font-size:17px}
#totop{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;
  font-weight:700;cursor:pointer;color:var(--sheet);background:var(--ink);border:0;border-radius:999px;padding:10px 16px;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.45);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
#totop.on{opacity:1;transform:none;pointer-events:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 태블릿 (701~1020): 톱이 위로, 사이드·오피니언이 두 칸 ── */
@media(max-width:1020px){
  .front{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .flead{grid-column:1/-1;order:-1;padding:0 0 24px;margin-bottom:22px;border-bottom:1px solid var(--hair)}

  .rowg>a{padding:0 16px!important;border:0!important}
  .rowg>a:nth-child(odd){padding-left:0!important}
  .rowg>a:nth-child(even){padding-right:0!important;border-left:1px solid var(--hair)!important}
  .fxcols{column-count:2}
  .comg{grid-template-columns:1fr 1fr}
  .comg>*:nth-child(3){grid-column:1/-1;border:0;padding:22px 0 0;margin-top:22px;border-top:1px solid var(--hair)}

/* ── 모바일 (≤700): 한국 언론사 모바일 문법 ── */
@media(max-width:700px){
  body{font-size:16px;background:var(--sheet)}
  .sheet{margin:0;padding:0 16px 28px;box-shadow:none}
  .topbar{padding:10px 0 8px}
  .topbar>span{display:none}
  .topbar nav{width:100%;justify-content:flex-end}

  .name{font-size:38px}
  .tag{font-size:11.5px;letter-spacing:.04em}
  .dateline{font-size:12px}
  .dateline .src3{display:none}

  /* 톱이 맨 위 — 사진을 화면 끝까지, 그 아래 제목 (조선·한겨레 모바일) */
  .front{display:flex;flex-direction:column;margin-top:0}
  .fside,.flead,.fop{padding:0;border:0}
  .flead{order:-1;margin:0 -16px;padding-bottom:18px;border-bottom:8px solid var(--soft)}
  .lead{display:flex;flex-direction:column}
  .lead>.pc{order:-1;margin-bottom:14px}
  .lead .pc .pcimg{border-radius:0}
  .lead .pc .q,.lead .pc .shade{display:none}
  .lead .pc figcaption{padding:0 16px}
  .lead>*:not(.pc):not(.issue){padding-left:16px;padding-right:16px}
  .lead .kick{margin:0 0 6px}
  .lead h2{font-size:25px;line-height:1.32;margin-bottom:8px}
  .lead .subh{display:block;font-size:16px;margin:0 0 10px}
  .lead .deck{font-size:16px;line-height:1.75;margin:8px 0 10px;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .issue{margin:14px 16px 0}
  .sides{grid-template-columns:1fr}
  .sides>div,.sides>div+div{padding:0;border:0}
  .sides>div+div{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair)}
  .lead>.relh{margin:16px 16px 0;padding:8px 0 0}
  .lead>.rel{margin:4px 16px 0;padding:0}

  /* 목록형: 제목·요약 왼쪽, 사진 오른쪽 */
  .fside{padding-top:6px}
  .story,.rowg>a{display:grid!important;grid-template-columns:minmax(0,1fr) 108px;column-gap:14px;align-items:start;
    padding:16px 0!important;margin:0!important;border:0!important;border-bottom:1px solid var(--hair)!important}
  .story .ph,.rowg .ph{grid-column:2;grid-row:1/span 5;aspect-ratio:4/3;width:108px;margin:0;border-radius:4px}
  .story .ph .file,.rowg .ph .file{display:none}
  .story>*:not(.ph),.rowg>a>*:not(.ph){grid-column:1}
  .story h3,.rowg h3{font-size:17px;line-height:1.42}
  .story .sb{font-size:14px}
  .story p,.rowg p{font-size:14px;-webkit-line-clamp:2;margin-top:5px}
  .rowg{display:block}
  .rowg>a:nth-child(n){border-left:0!important;padding-left:0!important;padding-right:0!important}
  .row{margin-top:8px}
  .row .secthd,.secn .secthd{border-top:0;padding-top:20px;margin-bottom:4px}
  .fop{margin-top:6px}
  .fop .mini{border-top:0;padding-top:22px;font-size:18px}
  .op{grid-template-columns:44px minmax(0,1fr)}
  .op .av{grid-column:1;grid-row:1}
  .op>div:first-child{grid-column:2}
  .op q{-webkit-line-clamp:3}
  .numbox{display:none}

  .secn{margin-top:14px;border-top:8px solid var(--soft);margin-left:-16px;margin-right:-16px;padding:0 16px}
  .secthd h2{font-size:20px}
  .fxcols{column-count:1}
  .has-lead .ph{aspect-ratio:16/9}
  .fxi{padding:14px 0;margin:0}
  .fxi .t{font-size:17px}
  .fxi .d{font-size:14px}
  .domgrid{grid-template-columns:1fr}
  .domlead{padding:0 0 14px}
  .domlist{padding:12px 0 0;border:0;border-top:1px solid var(--hair)}
  .ang{grid-template-columns:1fr;gap:2px}
  .comg{display:block}
  .comg>*{padding:16px 0!important;border:0!important;border-bottom:1px solid var(--hair)!important;margin:0!important}
  .tug{display:none}
  footer{font-size:11.5px}
  #totop{right:14px;bottom:14px;padding:10px 13px}
  #totop span{display:none}
}

<div class="sheet">

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const DOW = '일월화수목금토';
/* 제목 — 한 문장, 줄은 칸 폭이 정한다. '·' 나열이 줄 끝에서 끊기지 않게 단어 결합자로 묶는다 */
const hd = s => esc(String(s ?? '').replace(/\s*\n\s*/g, ' ')).replace(/·/g, '⁠·⁠');
const spaced = s => String(s || '').replace(/([.!?])(?=[가-힣A-Z])/g, '$1 ');   // 언론사 요약의 붙은 문장 띄우기

function korDate(ymd){
  const d = new Date(ymd + 'T00:00:00+09:00');
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
}
function shortSrc(src){
  const t = String(src || '').replace(/다매체 보도|Featured|Hero/g, '').trim();
  const p = t.split(/\s*,\s*/).filter(Boolean);
  return p.length > 1 ? `${p[0]} 외 ${p.length - 1}곳` : (p[0] || '');
}
const KIND = { foreign: 'f', domestic: 'd', community: 'c' };
const ph = (img, cls = 'ph') => img ? `<span class="${cls}"><img src="${esc(img.sm || img.src)}" alt="${esc(img.alt)}" loading="lazy">${img.file ? '<i class="file">자료사진</i>' : ''}</span>` : '';

/* 국내 기사 첫머리 — sharktalk.co.kr 포털이 언론사 공개 요약(og:description)을 받아 준다 */
const mustLede = (id, idx) => /^\d{8}_\d{4}$/.test(id || '') && Number.isInteger(idx)
  ? fetch(`https://sharktalk.co.kr/api/board/must/${id}/${idx}/lead`).then(r => r.ok ? r.json() : {}).then(j => spaced(j && j.lead)).catch(() => '')
  : Promise.resolve('');

/* ── 조각들 ── */
function storyCard(x){          // 1면 사이드
  return `<a class="story" href="${esc(x.url)}">
    ${ph(x.img)}
    <span class="lab ${KIND[x.kind]}">${esc(x.label)}</span>
    <h3 class="hl">${hd(x.head)}</h3>
    ${x.sub ? `<span class="sb">${hd(x.sub)}</span>` : ''}
    <p ${x.kind === 'domestic' ? `data-mi="${x.must_idx}"` : ''}>${esc(x.deck)}</p>
    <span class="src">${esc(x.src || '')}${x.echo ? ` · <span class="h">커뮤니티 댓글 ${fmt(x.echo.comments)}</span>` : ''}</span>
  </a>`;
}
function rowCard(x){            // 주요기사 줄
  return `<a href="${esc(x.url)}">
    ${ph(x.img)}
    <span class="lab ${KIND[x.kind]}">${esc(x.label)}</span>
    <h3 class="hl">${hd(x.head)}</h3>
    ${x.sub ? `<span class="sb">${esc(x.sub)}</span>` : ''}
    <p ${x.kind === 'domestic' ? `data-mi="${x.must_idx}"` : ''}>${esc(x.deck)}</p>
    <span class="src">${esc(x.src || '')}</span>
  </a>`;
}
function photo(L, R){
  const I = L.img;
  return `<figure class="pc">
    <a class="pcimg" href="${esc(L.fact_url || '#')}">
      <img src="${esc(I.src)}" srcset="${esc(I.sm)} 640w, ${esc(I.src)} 1200w" sizes="(max-width:700px) 100vw, 640px" alt="${esc(I.alt)}">
      ${L.sub ? `<span class="shade"></span><span class="q">${hd(L.sub)}</span>` : ''}
    </a>
    <figcaption>${I.credit ? `사진 <a href="${esc(I.credit_url)}">${esc(I.credit)}</a> / Unsplash` : (I.file ? '자료사진 · Unsplash' : '사진 · Unsplash')} · 외신 브리핑 선정</figcaption>
  </figure>`;
}
function issueBox(R){           // 쟁점 박스 — 커뮤니티 반응을 찬반으로
  const S = R.sides;
  return `<div class="issue">
    <div class="ih"><b>커뮤니티 반응</b><span>Hacker News 댓글 <span class="num">${fmt(R.comments)}</span> · 추천 ${fmt(R.points)} · 추천당 댓글 ${R.r.toFixed(2)}</span></div>
    ${S ? `<div class="sides"><div class="a"><span class="t">${esc(S.la)}</span><div>${esc(S.a)}</div></div>
      <div class="b"><span class="t">${esc(S.lb)}</span><div>${esc(S.b)}</div></div></div>`
        : `<p>${esc(R.summary)}</p>`}
    <a class="go" href="${esc(R.url)}">토론 원문 보기 →</a>
  </div>`;
}
function numBox(T){             // 숫자로 본 오늘 — 주제군 온도
  if (!T) return '';
  const v = T.values, n = v.length, max = Math.max(...v, 1), W = 280, H = 54, bw = W / n;
  const bars = v.map((x, i) => {
    const h = Math.max(1, x / max * (H - 4)), recent = i >= n - 3;
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${recent ? 'var(--heat)' : 'var(--hair)'}"/>`;
  }).join('');
  return `<div class="numbox">
    <div class="nh">숫자로 본 오늘<span>최근 14일</span></div>
    <div class="nv"><b>${esc(T.group)} 담론</b><span class="x">×${T.ratio}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>
    <p>최근 3일 커뮤니티 담론량이 그 전 4일의 ${T.ratio}배. 하루 단위, 오늘 미완성분 제외.</p>
  </div>`;
}

function render(F){
  const L = F.lead, R = L && L.reaction, S = F.sources || {}, SL = F.slots || { side: [], row: [] };
  const ymd = (F.edition || '').slice(0, 10);
  $('#dateline').innerHTML = `<span><b>${esc(korDate(ymd))}</b></span><span>제 ${F.no ?? '–'}호</span>
    <span class="src3">외신 ${esc(S.briefing || '–')} · 국내 ${esc((S.must || '–').slice(5))} · 커뮤니티 ${esc((S.signal || '–').slice(5))}</span>`;

  /* 톱 */
  let lead = '';
  if (L) {
    const kick = L.kind === 'cross' ? '오늘의 톱 · 외신 보도와 커뮤니티 반향' : L.kind === 'desk' ? '오늘의 톱 · 외신' : '오늘의 톱 · 커뮤니티';
    const rel = [];
    (L.related || []).forEach(k => rel.push(`<li><a class="hl" href="${esc(k.url)}">${hd(k.head)}</a><span>${esc(shortSrc(k.src))}</span></li>`));
    (R && R.kr || []).forEach(k => rel.push(`<li><a class="hl" href="${esc(k.url)}">${esc(k.title)}</a><span>국내</span></li>`));
    lead = `<article class="lead">
      <div class="kick">${kick}</div>
      <h2><a class="hl" href="${esc(L.fact_url || '#')}">${hd(L.headline)}</a></h2>
      ${L.sub ? `<p class="subh">${hd(L.sub)}</p>` : ''}
      ${L.img ? photo(L, R) : ''}
      <p class="deck">${esc(L.deck)}</p>
      <div class="by"><span>외신 브리핑${L.fact_src && L.fact_src.includes('·') ? ' · ' + esc(shortSrc(L.fact_src.split('·').slice(1).join('·'))) : ''}</span>
        ${L.orig_url ? `<a href="${esc(L.orig_url)}">원문 ↗</a>` : ''}<a href="${esc(L.fact_url || '#')}">브리핑 카드 →</a></div>
      ${R ? issueBox(R) : ''}
      ${rel.length ? `<div class="relh">관련 기사</div><ul class="rel">${rel.join('')}</ul>` : ''}
    </article>`;
  }
  if (L && !L.img && L.sub) lead = lead.replace('class="subh"', 'class="subh" style="display:block"');

  /* 오피니언 */
  const ops = (F.voices || []).map(v => v.kind === 'panel'
    ? `<a class="op" href="https://www.threads.com/@${esc(v.handle)}"><div>
        <div class="who">${esc(v.who)}<span>${esc(v.role || '@' + v.handle)}</span></div>
        <q>${esc(v.text)}</q><span class="when">Threads · ${esc((v.ts || '').slice(5, 16))}</span></div>
        <div class="av ${esc(v.tier)}">${esc((v.who || '?').trim()[0])}</div></a>`
    : `<a class="op" href="${esc(v.url)}"><div>
        <div class="who">${esc(v.who)}<span>신뢰층이 링크</span></div>
        <span class="tr hl">${esc(v.text)}</span><span class="when">Hacker News 댓글 ${fmt(v.comments)}</span></div>
        <div class="av T">✓</div></a>`).join('');

  const front = `<section class="front">
    <div class="fside">${(SL.side || []).map(storyCard).join('')}</div>
    <div class="flead">${lead}</div>
    <aside class="fop"><div class="mini">해석<span>국내 Threads 패널 · 신뢰층</span></div>${ops || '<p class="src">수집된 글 없음</p>'}${numBox(F.temperature)}</aside>
  </section>`;

  const row = (SL.row || []).length ? `<section class="row">
    <div class="secthd"><h2>주요 기사<small>${SL.picked ? '편집국 선정' : '외신 · 국내 · 커뮤니티'}</small></h2></div>
    <div class="rowg">${SL.row.map(rowCard).join('')}</div></section>` : '';

  /* 외신면 */
  const FS = F.foreign || [];
  const nF = FS.reduce((n, x) => n + x.items.length, 0);
  const foreign = nF ? `<section class="secn" id="foreign">
    <div class="secthd"><h2>외신<small>JFNB 외신 브리핑 · ${esc(S.briefing || '')}</small></h2><a href="${esc((F.links || {}).briefing || '#')}">브리핑 전체 →</a></div>
    <div class="fxcols">${FS.map(sec => `<div class="fxsec"><div class="fxname">${esc(sec.name === 'TOP' ? '주요' : sec.name)}</div>
      ${sec.items.map(x => `<a class="fxi${x.img ? ' has-' + (x.img.size || 'lead') : ''}" href="${esc(x.url)}">
        ${x.img ? `<span class="ph"><img src="${esc(x.img.sm || x.img.src)}" alt="${esc(x.img.alt)}" loading="lazy">${x.img.file ? '<i class="file">자료사진</i>' : ''}</span>` : ''}
        <span class="t hl">${hd(x.head)}</span>${x.sub ? `<span class="u">${hd(x.sub)}</span>` : ''}
        <span class="d">${esc(x.deck)}</span>
        <span class="src">${esc(shortSrc(x.source))}${x.echo ? ` · <span class="h">커뮤니티 댓글 ${fmt(x.echo.comments)}</span>` : ''}</span>
      </a>`).join('')}</div>`).join('')}</div></section>` : '';

  /* 국내면 */
  const D = F.domestic || {};
  const mx = D.lead ? Math.max(D.lead.outlets || 0, ...(D.list || []).map(a => +a.outlets || 0), 1) : 1;
  const dom = D.lead ? `<section class="secn" id="domestic">
    <div class="secthd"><h2>국내<small>Must News · ${esc((D.updated || '').slice(5))}</small></h2><a href="${esc((F.links || {}).must || '#')}">전체 순위 →</a></div>
    <div class="domgrid">
      <div class="domlead">
        <span class="lab d">${D.picked ? '국내 톱 · 편집국 선정' : '국내 톱 · Must News 1위'}</span>
        ${D.picked && D.pick_note ? `<p class="picknote">${esc(D.pick_note)}</p>` : ''}
        <div class="domtop"><h3><a class="hl" href="${esc(D.lead.url)}">${hd(D.lead.title)}</a></h3>
          <div class="reach"><b>${fmt(D.lead.outlets)}</b><span>개 매체 보도</span></div></div>
        <p class="domlede" id="domlede"${D.lead.lede ? '' : ' hidden'}>${esc(D.lead.lede || '')}</p>
        ${(D.lead.angles || []).length ? `<div class="angles"><div class="anghd">같은 사안, 매체별 제목</div>
          ${D.lead.angles.map(m => `<a class="ang" href="${esc(m.url)}"><span class="s">${esc(m.source)}</span><span class="t hl">${hd(m.title)}</span></a>`).join('')}</div>` : ''}
      </div>
      <ol class="domlist">${(D.list || []).map(a => `<li><span class="rk">${esc(a.rank)}</span>
        <a href="${esc(a.url)}"><span class="t hl">${hd(a.title)}</span><span class="s">${esc(a.source)}</span>
        <span class="l2" data-mi="${Number.isInteger(a.must_idx) ? a.must_idx : ''}" hidden></span></a>
        <span class="ol">${fmt(a.outlets)}곳</span>
        <i class="bar" style="width:${Math.max(2, (+a.outlets || 0) / mx * 100).toFixed(1)}%"></i></li>`).join('')}</ol>
    </div></section>` : '';

  /* 커뮤니티면 — 논쟁(줄다리기) + 외신 밖의 반향 */
  const items = [
    ...(F.features || []).map(f => ({ ...f, feat: true })),
    ...(F.wire || []),
  ].slice(0, 3);
  const com = items.length ? `<section class="secn" id="community">
    <div class="secthd"><h2>커뮤니티<small>해외 개발자들이 다툰 글 · Hacker News · Reddit</small></h2><a href="index.html">반향 관측 →</a></div>
    <div class="comg">${items.map(x => `<a class="cm" href="${esc(x.url)}">
      <span class="lab c">${x.feat ? '논쟁 · 댓글창이 갈라진 글' : '외신 밖의 반향'}</span>
      ${x.feat && x.sides ? `<div class="tug"><span class="a">${esc(x.sides.la)}</span><span class="b">${esc(x.sides.lb)}</span></div>` : ''}
      <h3 class="hl">${hd(x.title_ko || x.title)}</h3>${x.title_ko ? `<span class="sb">${esc(x.title)}</span>` : ''}
      <p>${esc(x.deck)}</p>
      <span class="src rnum"><b>${x.r.toFixed(2)}</b>추천당 댓글 · 댓글 ${fmt(x.comments)}</span></a>`).join('')}</div></section>` : '';

  $('#main').innerHTML = front + row + foreign + dom + com;

  /* 국내 첫머리 — 톱·순위·1면 칸 */
  const mid = SL.must_id || (D.lead && D.lead.must_id);
  if (D.lead && !D.lead.lede) mustLede(mid, D.lead.must_idx).then(t => { const el = $('#domlede'); if (t && el) { el.textContent = t; el.hidden = false; } });
  document.querySelectorAll('[data-mi]').forEach(el => {
    if (el.dataset.mi === '' || el.textContent.trim()) return;
    mustLede(mid, +el.dataset.mi).then(t => { if (t) { el.textContent = t; el.hidden = false; } });
  });

  $('#foot').innerHTML = `<span>조판 ${esc(F.edition)} KST · 사진은 외신 브리핑이 고른 것과 그 보관함의 자료사진(Unsplash) · 그림은 수집 데이터</span>
    <span><a href="${esc((F.links || {}).briefing || '#')}">외신 브리핑</a> · <a href="${esc((F.links || {}).must || '#')}">Must News</a> · <a href="index.html">반향 관측</a></span>`;
}

(async () => {
  try {
    const F = await fetch('data/front.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    render(F);
  } catch (e) {
    $('#main').innerHTML = `<div class="err">지면을 불러오지 못했습니다 (${esc(e.message)}).</div>`;
  }
})();

/* 방문자 수 — 외신 브리핑과 같은 방식(abacus, 같은 사람은 KST 하루 한 번) */
(() => {
  const API = 'https://abacus.jasoncameron.dev', NS = 'hong4137-uptodate', LS = 'uptodate-visited';
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  let seen = false;
  try { seen = localStorage.getItem(LS) === today; } catch (e) {}
  const mode = seen ? 'get' : 'hit', val = d => (d && (d.value ?? d.count));
  Promise.all([
    fetch(`${API}/${mode}/${NS}/global`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`${API}/${mode}/${NS}/daily-${today}`).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([t, d]) => {
    if (typeof val(t) !== 'number') return;
    if (!seen) { try { localStorage.setItem(LS, today); } catch (e) {} }
    $('#v-tot').textContent = fmt(val(t));
    $('#v-day').textContent = fmt(typeof val(d) === 'number' ? val(d) : 0);
    $('#visits').hidden = false;
  });
})();

/* 맨 위로 */
(() => {
  const b = $('#totop');
  const upd = () => b.classList.toggle('on', scrollY > innerHeight);
  addEventListener('scroll', upd, { passive: true }); upd();
  b.addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
})();

/* 테마 — index.html 과 같은 키 */
$('#tgl').addEventListener('click', () => {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', nx);
  try { localStorage.setItem('signal-theme', nx); } catch (e) {}
});
</script>
