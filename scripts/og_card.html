<!doctype html>
<meta charset="utf-8">
<!--
  링크 미리보기 썸네일 (1200×630) — 카톡·슬랙·X 가 og:image 로 쓴다.
  render_og.py 가 __DATA__ 자리에 그날 front.json 일부를 넣고 헤드리스 크롬으로 찍는다.
  미리보기는 작게 보이므로 글자는 크게, 요소는 셋만: 제호 · 오늘의 톱 · 숫자.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@500;600;700&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0A0D14}
body{position:relative;color:#E8E6E1;font-family:"IBM Plex Sans KR",sans-serif}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#18A2C60D 1px,transparent 1px),linear-gradient(90deg,#18A2C60D 1px,transparent 1px);
  background-size:40px 40px}
/* 사진 — 오른쪽에서 스며든다 */
.ph{position:absolute;right:0;top:0;width:560px;height:630px;background-size:cover;background-position:center}
.ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#0A0D14 0%,rgba(10,13,20,.86) 26%,rgba(10,13,20,.35) 62%,rgba(10,13,20,.15) 100%),
             linear-gradient(0deg,rgba(10,13,20,.9) 0%,rgba(10,13,20,0) 45%)}
.seis{position:absolute;left:0;right:0;top:58px;height:150px}
.seis svg{width:100%;height:100%;display:block}
.top{position:absolute;left:64px;right:64px;top:34px;display:flex;justify-content:space-between;
  font-family:"JetBrains Mono","IBM Plex Sans KR",monospace;font-size:19px;letter-spacing:.06em;color:#AFB6C0}
.top b{color:#E8E6E1}
.name{position:absolute;left:58px;top:78px;font-family:"Instrument Serif",serif;font-size:132px;line-height:1;
  letter-spacing:-.02em;color:#F4F2EC;white-space:nowrap}
.name em{color:#D2603A;font-style:italic}
.rule{position:absolute;left:64px;right:64px;top:236px;height:5px;border-top:1px solid #E8E6E1;border-bottom:1px solid #E8E6E1;opacity:.75}
.kick{position:absolute;left:64px;top:278px;font-family:"JetBrains Mono","IBM Plex Sans KR",monospace;font-size:19px;font-weight:700;
  letter-spacing:.14em;color:#D2603A}
.hl{position:absolute;left:62px;top:316px;width:860px;font-family:"Noto Serif KR",serif;font-weight:900;
  font-size:58px;line-height:1.22;letter-spacing:-.035em;color:#fff;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 2px 18px rgba(0,0,0,.55)}
.stats{position:absolute;left:64px;bottom:44px;display:flex;gap:40px;align-items:flex-end}
.st .n{font-family:"JetBrains Mono","IBM Plex Sans KR",monospace;font-weight:700;font-size:54px;line-height:1;letter-spacing:-.04em}
.st .l{font-size:18px;color:#AFB6C0;margin-top:8px}
.url{position:absolute;right:64px;bottom:48px;font-family:"JetBrains Mono","IBM Plex Sans KR",monospace;font-size:19px;color:#18A2C6;
  letter-spacing:.04em}
</style>
<div class="grid"></div>
<div class="ph" id="ph"></div>
<div class="seis" id="seis"></div>
<div class="top"><span id="date"></span><span id="no"></span></div>
<div class="name">Daily <em>UptoDate</em></div>
<div class="rule"></div>
<div class="kick" id="kick"></div>
<div class="hl" id="hl"></div>
<div class="stats" id="stats"></div>
<div class="url">signal.sharktalk.co.kr</div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
$('#date').innerHTML = `<b>${D.date}</b>`;
$('#no').textContent = D.no ? `제 ${D.no}호` : '';
$('#kick').textContent = D.kicker;
$('#hl').textContent = D.headline;
if (D.img) $('#ph').style.backgroundImage = `url("${D.img}")`;
$('#stats').innerHTML = D.stats.map(s =>
  `<div class="st"><div class="n" style="color:${s.c}">${s.n}</div><div class="l">${s.l}</div></div>`).join('');
/* 제호 뒤 지진계 — 1면과 같은 하루 담론량 */
(() => {
  const v = D.wave || []; if (v.length < 3) return;
  const W = 1200, H = 150, mid = H/2, max = Math.max(...v, 1), step = W / v.length, bw = Math.max(2, step*.55);
  let g = '';
  v.forEach((x,i) => {
    const h = Math.max(1.5, x/max*H*.47), last = i === v.length-1;
    g += `<rect x="${(i*step+(step-bw)/2).toFixed(1)}" y="${(mid-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(2*h).toFixed(1)}"
      fill="${last ? '#D2603A' : '#18A2C6'}" opacity="${last ? .9 : .32}"/>`;
  });
  $('#seis').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#18A2C6" stroke-opacity=".25"/>${g}</svg>`;
})();
</script>
