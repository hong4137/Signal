name: Sports collect

# Sports UptoDate — 이번 주 볼 경기·결과 (ESPN 공개 API, LLM 없음). 3시간마다.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-sports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: python scripts/collect_sports.py
      - name: Commit
        run: |
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/sports.json data/sports.ics data/world_tv_cache.json data/korea_u23_cache.json 2>/dev/null || git add data/sports.json data/sports.ics
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "스포츠 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
