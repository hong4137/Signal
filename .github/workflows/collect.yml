name: Signal collect

# 하루 3회 — 22시 판이 핵심이다(미국 오전이 한국 밤).
# 브리핑 sync-drive.yml 과 같은 패턴. PC 가 꺼져 있어도 돈다.
on:
  schedule:
    - cron: '0 23 * * *'   # KST 08:00
    - cron: '0 5 * * *'    # KST 14:00
    - cron: '0 13 * * *'   # KST 22:00  ← 핵심 판
  workflow_dispatch:
    inputs:
      days:
        description: '수집 윈도우(일)'
        required: false
        default: '3'
      min_comments:
        description: 'HN 댓글 하한'
        required: false
        default: '120'
      skip_enrich:
        description: '1이면 Gemini 보강 생략'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: signal-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 1. 수집 — 순수 HTTP. 데이터센터 IP 에서 잘 돈다 ──
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub 검색 레이트리밋 완화
          # Substack 이 Actions(Azure) IP 를 403 으로 막는다.
          # collect.py 가 403 일 때만 Worker 프록시로 우회하므로 여기에도 필요하다.
          THREADS_WORKER_URL: ${{ secrets.THREADS_WORKER_URL }}
          THREADS_WORKER_KEY: ${{ secrets.THREADS_WORKER_KEY }}
        run: |
          python collect.py \
            --days "${{ github.event.inputs.days || '3' }}" \
            --min-comments "${{ github.event.inputs.min_comments || '120' }}" \
            --top 30

      # ── 2. 보강 — 한국어 요약 + 국내 매칭 ──
      #    키가 없으면 조용히 건너뛴다(수집 결과는 그대로 남는다)
      - name: Enrich
        if: ${{ github.event.inputs.skip_enrich != '1' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID:      ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:  ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 미설정 — 보강 건너뜀"; exit 0
          fi
          python enrich.py --limit 12 --batch 3 --max-calls 40

      # ── 3. Threads 패널 — Cloudflare Worker 호출 ──
      #    Worker 가 브라우저를 대신 띄운다. Actions 에는 브라우저가 필요 없다.
      # ⚠️ secrets 컨텍스트는 if: 에 쓸 수 없다 (env:/with: 에서만 가능).
      #    if: ${{ secrets.X != '' }} 로 쓰면 워크플로가 검증 단계에서 실패하고,
      #    그러면 스케줄 자체가 등록되지 않는다 — cron 이 영영 안 돈다.
      #    비어 있는지는 스텝 안에서 확인한다.
      - name: Threads panel
        continue-on-error: true
        env:
          THREADS_WORKER_URL: ${{ secrets.THREADS_WORKER_URL }}
          THREADS_WORKER_KEY: ${{ secrets.THREADS_WORKER_KEY }}
        run: |
          if [ -z "$THREADS_WORKER_URL" ]; then
            echo "THREADS_WORKER_URL 미설정 — 패널 건너뜀"; exit 0
          fi
          python scripts/fetch_panel.py

      # 1면 조판 — 외신 브리핑·Must News·Signal 을 한 면에 앉힌다 (data/front.json).
      # 패널 다음에 돌아야 해석 칸이 최신 글을 쓴다. 실패해도 수집물은 커밋된다.
      - name: Front page
        continue-on-error: true
        run: |
          python scripts/build_front.py

      # ⚠️ data/ 와 panel_kr.json 은 매 실행 통째로 다시 만들어지는 생성물이다.
      #    봇 커밋끼리 겹치면 충돌이 나는데, 그때 정답은 **방금 수집한 쪽**이다.
      #    예전엔 `git pull --rebase || true` 로 실패를 삼켜 detached HEAD 로
      #    푸시를 시도하다 워크플로가 통째로 실패했다.
      - name: Commit
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data panel_kr.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "Signal $(date -u +'%Y-%m-%d %H:%M') UTC"

          for try in 1 2 3; do
            git fetch -q origin main
            # 리베이스 중에는 'theirs' 가 지금 얹고 있는 우리 커밋이다
            if ! git rebase -X theirs origin/main; then
              git checkout --theirs -- data panel_kr.json 2>/dev/null || true
              git add -A data panel_kr.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            if git push; then
              echo "푸시 성공 (시도 $try)"; exit 0
            fi
            echo "푸시 경합 — 재시도 $try"; sleep 5
          done
          echo "3회 재시도 실패"; exit 1
