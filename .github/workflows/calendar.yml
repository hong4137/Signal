name: Calendar collect

# 경제 일정 원자료 — LLM 없이 API·공식 일정표만. 06:20 경제 일정 루틴이 읽는다.
# cron 이 몇 시간 늦어도 06:20 전에 끝나도록 새벽 3시에 돈다.
on:
  schedule:
    - cron: '0 18 * * *'   # KST 03:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-calendar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect calendar sources
        env:
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect_calendar.py

      - name: Commit
        run: |
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/calendar_raw.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "경제 일정 원자료 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
