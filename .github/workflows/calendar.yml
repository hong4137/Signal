name: Calendar collect

# 경제 일정 원자료 — LLM 없이 API·공식 일정표만. 06:20 경제 일정 루틴이 읽는다.
# GitHub 예약 실행은 실측 1~10시간 밀린다(03:00 예약이 07:13~12:54 에 돌아, 06:20 루틴이 늘 하루 묵은 원자료를 읽었다).
# 그래서 전날 저녁 18:17 KST 에 돈다 — 9시간 밀려도 06:20 전에 끝난다. 정각을 피해 덜 밀리게 :17.
# 간밤 발표치(실제치)는 원자료에 없다(발표 날짜만). 그런 칸을 붙이면 아침 수집이 필요해진다 → GAS 정시 호출로 바꿀 것.
# 관제실(sharktalk-ops services.json)이 06:00 마감으로 이 파일의 신선도를 본다.
on:
  schedule:
    - cron: '17 9 * * *'   # KST 18:17 (전날 저녁)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-calendar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect calendar sources
        env:
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/collect_calendar.py

      - name: Commit
        run: |
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data/calendar_raw.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "경제 일정 원자료 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
